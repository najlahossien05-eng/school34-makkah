.sched-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--lime)}
.sched-list{display:flex;flex-direction:column;gap:8px}
.sched{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:14px;background:var(--soft);border-inline-start:3px solid var(--petrol);text-decoration:none;color:inherit}
.sched.duty,.sched.dutyend{border-inline-start-color:var(--lime)}
.sched b{font-family:var(--f-display);font-size:14px}
.sched span{font-size:12.5px;color:var(--muted)}
@media (max-width:1280px){
  .d-head{grid-template-columns:minmax(0,1fr) auto}
  .kpis{grid-column:1/-1}
  .kpi{flex:1}
}
@media (max-width:1100px){
  .d-chart,.d-hero,.d-table,.d-people,.d-sched{grid-column:span 12;grid-row:auto}
  .d-goal,.d-rem{grid-column:span 6}
  .d-people{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .d-head{grid-template-columns:1fr}
  .d-tools{order:3}
  .kpis{flex-direction:column}
  .kpi{min-width:0}
  .d-goal,.d-rem{grid-column:span 12}
  .d-people{grid-template-columns:1fr}
  .hero-media{grid-template-columns:1fr}
  .hero-side{grid-template-columns:1fr 1fr;grid-template-rows:96px}
  .hero-body{grid-template-columns:1fr}
  .mini-search input{width:120px}
  .dcard{padding:18px}
}
</style>
</head>

          <section class="panel">

            <button type="button" class="btn btn-ghost btn-block" id="copy"><i data-lucide="link"></i>نسخ رابط هذا العنصر</button>
            <div class="note-ok" id="copied" aria-live="polite"></div>

            ${next ? `<a href="#${hashFor(next.id)}" style="grid-column:2;text-align:left"><span>التالي</span><b>${esc(g(next.name))}</b></a>` : ''}
            ${prev ? `<a href="#${hashFor(prev.id)}" style="grid-column:1;grid-row:1"><span>السابق</span><b>${esc(g(prev.name))}</b></a>` : ''}
          </nav>
        </aside>
      </div>
    </div>`;
    app.querySelectorAll('.ev input').forEach(box => box.addEventListener('change', () => {
      const all = checks(); const set = new Set(all[id] || []);
      box.checked ? set.add(+box.dataset.k) : set.delete(+box.dataset.k);

  function mockDb(){
    const KEY = 'mock-school-db';
    let data = store.get(KEY) || {};
    const subs = new Set();
    const save = () => { store.set(KEY, data); setTimeout(() => subs.forEach(f => f()), 0); };
    const snap = p => ({id: p.split('/').pop(), exists: p in data, data: () => data[p], metadata: {fromCache: false, hasPendingWrites: false}});
    const doc = p => ({id: p.split('/').pop(), path: p,
      get: async () => snap(p),
      set: async v => { data[p] = clone(v); save(); },
      update: async v => { data[p] = Object.assign({}, data[p], clone(v)); save(); },
      delete: async () => { delete data[p]; save(); },
      onSnapshot(next){ const f = () => next(snap(p)); subs.add(f); setTimeout(f, 30); return () => subs.delete(f); }});
    function query(col, filters, ord, lim){
      const run = () => {
        let docs = Object.keys(data).filter(k => k.startsWith(col + '/') && k.split('/').length === col.split('/').length + 1).map(snap);
        filters.forEach(([f, op, v]) => { docs = docs.filter(d => { const x = d.data()[f]; return op === '==' ? x === v : op === '>=' ? x >= v : op === '<=' ? x <= v : op === '>' ? x > v : op === '<' ? x < v : true; }); });
        if (ord) docs.sort((a, b) => (a.data()[ord[0]] > b.data()[ord[0]] ? 1 : -1) * (ord[1] === 'desc' ? -1 : 1));
        if (lim) docs = docs.slice(0, lim);
        return {docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: {fromCache: false}};
      };
      return {where: (f, op, v) => query(col, [...filters, [f, op, v]], ord, lim), orderBy: (f, d) => query(col, filters, [f, d || 'asc'], lim), limit: n => query(col, filters, ord, n),
        get: async () => run(), onSnapshot(next){ const f = () => next(run()); subs.add(f); setTimeout(f, 30); return () => subs.delete(f); }};
    }
    return {doc, collection: c => Object.assign(query(c, [], null, 0), {path: c, doc: id => doc(c + '/' + (id || Math.random().toString(36).slice(2, 12))), add: async v => { const d = doc(c + '/' + Math.random().toString(36).slice(2, 12)); await d.set(v); return d; }})};

        <circle cx="80" cy="80" r="${R}" class="dn-b" stroke-dasharray="${C * Math.max(0, 1 - f1 - gap)} ${C}" stroke-dashoffset="${-C * f1}" transform="rotate(-90 80 80)"/>
        <circle cx="80" cy="80" r="44" class="dn-in"/>
        <text x="80" y="80" class="dn-v">${pc(A.overall)}</text><text x="80" y="99" class="dn-k">الأداء العام</text></svg></div>

      </div>`;
  }
  function subTrend(force){
    if (!db) return;
    const range = M.dashRange || 'week';
    const start = range === 'week' ? weekStart() : addDays(today(), -27), end = range === 'week' ? addDays(weekStart(), 4) : today();
    if (!force && M.trend.key === range + start) return;
    M.trend = {key: range + start, start, end};
    ['att', 'late'].forEach(c => routeSubs.push(db.collection(c).where('date', '>=', start).where('date', '<=', end).onSnapshot(x => { M.trend[c] = x.docs.map(d => d.data()); drawArea(); }, () => {})));
  }
  function smooth(pts){
    if (pts.length < 2) return pts.length ? `M${pts[0][0]},${pts[0][1]}` : '';
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      d += ` C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`;
    }
    return d;
  }
  function drawArea(){
    const el = document.getElementById('area-chart'); if (!el || !(dbState === 'ok' && S.staffReady)) return;
    const tr = M.trend || {}; if (!tr.start) return;
    const days = []; for (let d = tr.start; d <= tr.end; d = addDays(d, 1)) if (dayIdx(d) <= 4) days.push(d);
    const pts = days.map(d => { const a = (tr.att || []).find(x => x.date === d); const rec = a && a.rec ? Object.values(a.rec) : []; const L = (tr.late || []).find(x => x.date === d);
      return {d, has: !!a, p: rec.filter(r => r.s === 'p' || r.s === 'l').length, x: rec.filter(r => r.s === 'a' || r.s === 'l').length, a: rec.filter(r => r.s === 'a').length, l: rec.filter(r => r.s === 'l').length, c: L ? (L.entries || []).length : 0}; });
    const top = Math.max(4, Math.ceil(Math.max(S.staff.length, ...pts.map(p => p.p)) / 4) * 4);
    const W = 640, H = 230, X0 = 40, X1 = W - 14, Y0 = 14, Y1 = 190;
    const xs = i => pts.length < 2 ? (X0 + X1) / 2 : X1 - i * (X1 - X0) / (pts.length - 1);
    const ys = v => Y1 - v / top * (Y1 - Y0);
    const P1 = pts.map((p, i) => [xs(i), ys(p.p)]), P2 = pts.map((p, i) => [xs(i), ys(p.x)]);
    const line1 = smooth(P1), line2 = smooth(P2);
    const area1 = line1 + ` L${P1[P1.length - 1][0]},${Y1} L${P1[0][0]},${Y1} Z`;
    const step = Math.max(1, Math.ceil(pts.length / 10));
    let svg = `<defs><linearGradient id="ag1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="ag-a"/><stop offset="1" class="ag-b"/></linearGradient></defs>`;
    [0, .25, .5, .75, 1].forEach(f => { const v = Math.round(top * f); svg += `<line x1="${X0}" x2="${X1}" y1="${ys(v)}" y2="${ys(v)}" class="gl"/><text x="${X0 - 8}" y="${ys(v) + 4}" class="ax" text-anchor="end">${ar(v)}</text>`; });
    svg += `<rect id="hover-band" x="0" y="${Y0}" width="0" height="${Y1 - Y0}" rx="10" class="band" opacity="0"/>`;
    svg += `<path d="${area1}" fill="url(#ag1)"/><path d="${line1}" class="ln1"/><path d="${line2}" class="ln2"/>`;
    pts.forEach((p, i) => { if (i % step === 0 || i === pts.length - 1) svg += `<text x="${xs(i)}" y="${Y1 + 24}" class="xl${p.d === today() ? ' now' : ''}" text-anchor="middle">${M.dashRange === 'week' ? DAYS[dayIdx(p.d)] : ar(parseD(p.d).getDate()) + '/' + ar(parseD(p.d).getMonth() + 1)}</text>`; });
    svg += `<circle id="hover-dot" r="6" class="hdot" cx="-20" cy="-20"/>`;
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="الحضور والغياب خلال المدة">${svg}</svg><div class="tip" id="area-tip" hidden></div>${pts.some(p => p.has) ? '' : '<p class="muted chart-empty">لم تُسجَّل أيام حضور في هذه المدة بعد.</p>'}`;
    const svgEl = el.querySelector('svg'), tip = el.querySelector('#area-tip'), band = el.querySelector('#hover-band'), dot = el.querySelector('#hover-dot');
    const bw = Math.max(16, Math.min(46, (X1 - X0) / Math.max(1, pts.length - 1) * .7));
    const show = i => {
      const p = pts[i], x = xs(i);
      band.setAttribute('x', x - bw / 2); band.setAttribute('width', bw); band.setAttribute('opacity', 1);
      dot.setAttribute('cx', x); dot.setAttribute('cy', ys(p.p));
      tip.hidden = false;
      tip.innerHTML = `<b>${dayName(p.d)} ${ar(parseD(p.d).getDate())}/${ar(parseD(p.d).getMonth() + 1)}</b>${p.has ? `<span><i class="lg ok"></i>${g('{حاضر|حاضرة}')}<b>${ar(p.p)}</b></span><span><i class="lg lime"></i>${g('{غائب|غائبة}')}<b>${ar(p.a)}</b></span><span><i class="lg wait"></i>${g('{متأخر|متأخرة}')}<b>${ar(p.l)}</b></span><span><i class="lg bad"></i>تأخر حصص<b>${ar(p.c)}</b></span>` : '<span>لم يُسجَّل</span>'}`;
      const r = svgEl.getBoundingClientRect(), px = x / W * r.width, py = ys(p.p) / H * r.height;
      tip.style.left = Math.min(r.width - tip.offsetWidth - 4, Math.max(4, px - tip.offsetWidth / 2 + (px > r.width / 2 ? -tip.offsetWidth / 2 - 18 : tip.offsetWidth / 2 + 18))) + 'px';
      tip.style.top = Math.max(0, py - 30) + 'px';
    };
    const nearest = ev => { const r = svgEl.getBoundingClientRect(); const x = (ev.clientX - r.left) / r.width * W; let bi = 0, bd = 1e9; pts.forEach((_, i) => { const d = Math.abs(xs(i) - x); if (d < bd) { bd = d; bi = i; } }); return bi; };
    svgEl.addEventListener('mousemove', ev => show(nearest(ev)));
    svgEl.addEventListener('mouseleave', () => { tip.hidden = true; band.setAttribute('opacity', 0); dot.setAttribute('cx', -20); });
    const ti = pts.findIndex(p => p.d === today()); if (ti >= 0 && pts[ti].has) show(ti);
  }

    icons();
  }

  function matchJob(t){
    const norm = x => String(x || '').replace(/[()]/g, ' ').split(/\s+/).filter(Boolean).map(w => w.replace(/^(ال|لل)/, '')).join(' ');
    t = String(t || '').trim(); if (!t) return DEF_JOB;
    if (t === 'قائد المدرسة' || t === 'قائدة المدرسة') return '{مدير|مديرة} المدرسة';
    const forms = j => [j, j.replace(/\{([^|]*)\|([^}]*)\}/g, '$1'), j.replace(/\{([^|]*)\|([^}]*)\}/g, '$2')];
    const hit = JOBS.find(j => forms(j).some(f => f === t)) || JOBS.find(j => forms(j).some(f => norm(f) === norm(t)));
    return hit || t;
  }
  function parseRows(text){
    return String(text || '').replace(/^﻿/, '').split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
      const cells = l.includes('\t') ? l.split('\t') : l.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/);
      return cells.map(c => c.replace(/^"|"$/g, '').replace(/""/g, '"').trim());
    }).filter(r => r[0] && !/^(الاسم|اسم|name|#)$/i.test(r[0]) && !(r[0] === '#' || /^\d+$/.test(r[0]) && !r[1]));
  }
  function ioPreview(){
    const out = document.getElementById('io-preview');
    let rows = parseRows(document.getElementById('io-paste').value);
    rows = rows.map(r => /^\d+$/.test(r[0]) && r[1] && !/^\d+$/.test(r[1]) ? r.slice(1) : r);
    const items = rows.map(r => ({name: r[0], empNo: (r[1] || '').replace(/\s/g, ''), job: matchJob(r[2]), subject: r[3] || '', phone: r[4] || ''}));
    const dup = it => S.staff.some(s => (it.empNo && s.empNo === it.empNo) || s.name === it.name);

  }
  function nafsBlock(N){
    if (!N || !(N.grades || []).length) return soon('نتائج الاختبارات الوطنية (نافس).');
    return `<p class="muted">${esc(N.note || '')}</p><div class="nafs-grades">${N.grades.map(g2 => `<section class="nafs-g"><h3>${esc(g2.g)}</h3><div class="nafs-cards">${g2.subjects.map(s => `<div class="nafs-c"><span class="nafs-s">${esc(s.s)}</span><b class="nafs-avg">${num(s.avg)}</b><span class="muted">متوسط الدرجة</span><span class="delta ${s.d >= 0 ? 'up' : 'down'}"><i data-lucide="${s.d >= 0 ? 'trending-up' : 'trending-down'}"></i>${s.d >= 0 ? '+' : '−'}${num(Math.abs(s.d))} عن 2025م</span><div class="mast"><span>الإتقان ${pc(s.m)}</span><span class="pbar thin"><i style="width:${s.m}%"></i></span></div></div>`).join('')}</div></section>`).join('')}</div>`;
  }

  /* ---------- صفحة الإنجازات ---------- */
  function achPage(){
    const P = SP(), A = P.ach || {};
    app.innerHTML = `<div class="wrap page ach">
      <section class="ach-hero"><div class="ach-hero-t"><span class="chip light">${esc(A.cycle || '')}</span><h1>أبرز إنجازات المدرسة</h1><p>${esc(P.name || '')} · ${esc(A.source || '')}</p>${folderBtn2('ach', 'btn-outline-light')}</div><div class="ach-hero-r">${A.overall ? ring(A.overall, 150) : ''}</div></section>
      <section class="panel"><h2><i data-lucide="medal"></i>المدرسة في مستوى التميز</h2>${levelBlock(A)}</section>
      ${(A.top || []).length ? `<section class="panel"><h2><i data-lucide="mountain"></i>مؤشرات القمة</h2><ol class="top-list">${A.top.map((x, i) => `<li><span class="top-n">${ar(i + 1)}</span><span class="top-t">${esc(x.t)}</span>${meter(x.v, 'gold')}<b>${pc(x.v)}</b></li>`).join('')}</ol></section>` : ''}
      <div class="det-grid">${(A.details || []).map(d => `<section class="det"><div class="det-head"><span class="det-ico"><i data-lucide="${esc(d.icon || 'circle')}"></i></span><div><h3>${esc(d.name)}</h3><span>${esc(d.lead)}</span></div><b class="det-v">${pc(d.v)}</b></div>
        <ul>${d.items.map(x => `<li><span>${esc(x.t)}</span><b>${pc(x.v)}</b>${meter(x.v)}</li>`).join('')}</ul></section>`).join('')}</div>
      ${A.values ? `<section class="panel values"><div class="val-head"><div><h2><i data-lucide="heart"></i>${esc(A.values.title)}</h2><p class="muted">حقق ${esc(A.values.std)} ${pc(A.values.v)} في مستوى التميز</p></div><b class="det-v">${pc(A.values.v)}</b></div>
        <div class="val-grid">${A.values.items.map(x => `<div class="val"><b>${pc(x.v)}</b><span>${esc(x.t)}</span></div>`).join('')}</div></section>` : ''}
      <section class="panel"><h2><i data-lucide="chart-column"></i>درجات نافس للصف الثالث والسادس</h2>${nafsBlock(A.nafs)}</section>
      ${(A.keep || []).length ? `<section class="sustain"><h2><i data-lucide="infinity"></i>نحو استدامة التميز</h2><div class="sus-cols"><div><h3>نحافظ على</h3><ul>${A.keep.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div><div><h3>نركّز على</h3><ul>${A.focus.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div></div></section>` : ''}
      ${A.thanks ? `<section class="thanks"><i data-lucide="heart-handshake"></i><h2>${esc(A.thanks)}</h2><p>${esc(A.thanksTo || '')}</p></section>` : ''}
    </div>`;
  }

  /* ---------- تبويب لوحة التحكم: ملف المدرسة ---------- */
  function tabSchool(){
    const d = draft; d.school = d.school || {};
    const P = d.school, tab = document.getElementById('tab');
    const lines = a => (a || []).join('\n');
    const pairs = (a, f1, f2) => (a || []).map(x => x[f1] + (x[f2] ? ' | ' + x[f2] : '')).join('\n');
    const ta = (id, label, val, hint, h) => `<div class="field full"><label for="${id}">${label}</label><textarea class="in" id="${id}" style="min-height:${h || 110}px">${esc(val || '')}</textarea>${hint ? `<span class="hint">${hint}</span>` : ''}</div>`;
    tab.innerHTML = `<div class="stack">
      <div class="panel"><h2><i data-lucide="megaphone"></i>الشريط التحفيزي</h2><div class="form-grid">${ta('sc-banner', 'العبارات', lines(P.banner), 'كل عبارة في سطر. اتركه فارغًا لإخفاء الشريط.', 150)}</div></div>
      <div class="panel"><h2><i data-lucide="users-round"></i>البيانات الأساسية</h2><div class="form-grid">
        ${ta('sc-leaders', 'القيادات', pairs(P.leaders, 'role', 'name').replace(/^(.*?) \| (.*)$/gm, '$1 | $2'), 'كل سطر: المسمى | الاسم', 120)}
        ${ta('sc-counts', 'أعداد المنسوبات', (P.counts || []).map(c => c.label + ' | ' + c.n).join('\n'), 'كل سطر: الفئة | العدد', 160)}
        ${ta('sc-teachers', 'أسماء الهيئة التعليمية', lines(P.teachers), 'اسم في كل سطر.', 200)}
        <div class="field"><label for="sc-tslots">عدد خانات المعلمات</label><input class="in" type="number" min="0" id="sc-tslots" value="${esc(P.teachersSlots || 0)}"></div>
        <div class="field"><label for="sc-aslots">عدد خانات الإداريات</label><input class="in" type="number" min="0" id="sc-aslots" value="${esc(P.adminsSlots || 0)}"></div>
        ${ta('sc-admins', 'أسماء الكادر الإداري', lines(P.admins), 'اسم في كل سطر.', 150)}
      </div></div>
      <div class="panel"><h2><i data-lucide="eye"></i>الرؤية والرسالة والسيرة</h2><div class="form-grid">
        ${ta('sc-vision', 'الرؤية', P.vision)}${ta('sc-mission', 'الرسالة (اختياري)', P.mission)}
        ${ta('sc-bio', 'السيرة الذاتية لمديرة المدرسة', P.bio, 'كل فقرة في سطر.', 160)}
        ${ta('sc-about', 'من نحن (٣٤)', P.about, '', 130)}
      </div></div>
      <div class="panel"><h2><i data-lucide="school"></i>بيانات المدرسة والتقارير والمبادرات</h2><div class="form-grid">
        ${ta('sc-info', 'بيانات المدرسة', pairs(P.info, 'k', 'v'), 'كل سطر: البيان | القيمة', 200)}
        ${ta('sc-reports', 'تقارير منصة التميز', pairs(P.reports, 'label', 'url'), 'كل سطر: عنوان التقرير | الرابط (https://…)', 120)}
        ${ta('sc-inits', 'المبادرات', (P.initiatives || []).map(x => [x.t, x.d, x.url].filter(Boolean).join(' | ')).join('\n'), 'كل سطر: اسم المبادرة | وصف مختصر | رابط الشواهد (اختياري)', 150)}
      </div><div id="sc-err"></div></div>
    </div>`;
    const L = id => document.getElementById(id).value.split('\n').map(s => s.trim()).filter(Boolean);
    const split = s => s.split('|').map(x => x.trim());
    const read = () => {
      P.banner = L('sc-banner');
      P.leaders = L('sc-leaders').map(s => { const [role, name] = split(s); return {role: role || '', name: name || ''}; });
      P.counts = L('sc-counts').map(s => { const [label, n] = split(s); return {label: label || '', n: Math.max(0, parseInt(String(n || '0').replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c)), 10) || 0)}; });
      P.teachers = L('sc-teachers'); P.admins = L('sc-admins');
      P.teachersSlots = Math.max(0, +document.getElementById('sc-tslots').value || 0); P.adminsSlots = Math.max(0, +document.getElementById('sc-aslots').value || 0);
      P.vision = document.getElementById('sc-vision').value.trim(); P.mission = document.getElementById('sc-mission').value.trim();
      P.bio = document.getElementById('sc-bio').value.trim(); P.about = document.getElementById('sc-about').value.trim();
      P.info = L('sc-info').map(s => { const [k, ...v] = split(s); return {k: k || '', v: v.join(' | ')}; });
      P.reports = L('sc-reports').map(s => { const [label, url] = split(s); return {label, url: url || ''}; });
      P.initiatives = L('sc-inits').map(s => { const [t, d2, url] = split(s); return {t: t || '', d: d2 || '', url: url || ''}; });
      const bad = P.reports.concat(P.initiatives).find(x => x.url && !okUrl(x.url));
      document.getElementById('sc-err').innerHTML = bad ? '<div class="msg err" style="margin-top:12px">أحد الروابط غير صالح. يجب أن يبدأ الرابط بـ https://</div>' : '';
      touch(); renderTicker();
    };
    tab.querySelectorAll('textarea,input').forEach(el => el.addEventListener('input', read));
  }

  /* ---------- التوجيه ---------- */
  function route(){
    let h = (location.hash || '').replace('#', '');
    const st = cur().settings;
    if (h.startsWith('g-')) { ed = 'f'; h = h.slice(2); }
    else if (h && h !== 'admin') ed = 'm';
    else { const sv = store.get('edition'); ed = sv === 'f' || sv === 'm' ? sv : (st.defaultEdition || 'm'); }
    const old = /^e(\d{1,2})$/.exec(h); if (old) h = 'i' + old[1];
    if (!h) h = 'home';
    const school = SCHOOL_ROUTES.includes(h);
    const pg = h === 'profile' || h === 'ach';
    const item = !school && !pg && h !== 'admin' && h !== 'ev' && /^[a-z][a-z0-9]{1,24}$/.test(h);
    activeRoute = (school || item || pg || h === 'admin' || h === 'ev') ? h : 'home';
    chrome();
    if (!school) { clearRouteSubs(); curRoute = ''; }
    if (h === 'admin') admin();
    else if (h === 'ev') evHome();
    else if (h === 'profile') profilePage();
    else if (h === 'ach') achPage();
    else if (school) renderSchool(h);
    else if (item) element(h);
    else renderSchool('home');
    renderBar();
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('#edition button').forEach(b => b.addEventListener('click', () => {
    ed = b.dataset.ed; store.set('edition', ed);
    const h = (location.hash || '').replace('#', '').replace(/^g-/, '') || 'home';
    if (h === 'admin') { chrome(); route(); return; }
    const t = hashFor(h);
    if ('#' + t === location.hash) route(); else location.hash = t;
  }));
  window.addEventListener('hashchange', route);
  route();

  /* ---------- الصلاحيات ---------- */
  (async function caps(){
    if (!window.claude || typeof claude.use !== 'function') {
      if (isLocal || webHost) { canWrite = true; deviceMode = webHost; initDb(mockDb()); } else initDb(null);
      return;
    }
    let u = null;
    try { u = await claude.use('user'); } catch(e) {}
    try { art = await claude.use('artifact'); } catch(e) { art = null; }
    try { dl = await claude.use('downloads'); } catch(e) { dl = null; }
    let d = null;
    try { d = await claude.use('db'); } catch(e) { d = null; }
    if (d) { let w = null; try { w = u ? await u.can('data.write') : null; } catch(e) {} canWrite = w !== false; }
    if (art) { let ok = true; try { if (u) ok = (await u.isOwner()) || (await u.canEdit()); } catch(e) {} canEdit = ok; }
    initDb(d);
    chrome(); renderBar();
    if ((location.hash || '') === '#admin' || staleDraft) route();
  })();
})();
</script>
</body>
</html>
