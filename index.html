<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>الابتدائية الرابعة والثلاثون — الرئيسية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap">
<style id="css">
/* تخطيط: ترويسة رسمية + لوحة تعريف + أقسام بشبكات بطاقات؛ صفحة العنصر عمودان؛ لوحة تحكم بتبويبات وشريط حفظ سفلي */
:root{
  --bg:#F1F5F6; --surface:#FFFFFF; --soft:#E8F0F1; --line:#D7E2E4;
  --ink:#14313A; --muted:#5A6F76;
  --petrol:#0F4E5C; --teal:#1E8A8A; --green:#3E9F6A; --onpetrol:#FFFFFF;
  --ok:#2E8B57; --okbg:#E3F3EA; --wait:#9A6B12; --waitbg:#FBF1DC; --bad:#B23A3A; --badbg:#FBE7E7;
  --shadow:0 1px 2px rgba(15,78,92,.06),0 6px 18px rgba(15,78,92,.06);
  --f-display:"Almarai","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Almarai","Segoe UI",Tahoma,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C181C; --surface:#12232A; --soft:#173039; --line:#22404A;
  --ink:#E4EEF0; --muted:#98B0B6;
  --petrol:#5FB4C2; --teal:#58C0B5; --green:#6CC48F; --onpetrol:#06262E;
  --ok:#7BD3A0; --okbg:#173A2B; --wait:#E8C46E; --waitbg:#3A2F17; --bad:#F09A9A; --badbg:#3D1E1E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C181C; --surface:#12232A; --soft:#173039; --line:#22404A;
  --ink:#E4EEF0; --muted:#98B0B6;
  --petrol:#5FB4C2; --teal:#58C0B5; --green:#6CC48F; --onpetrol:#06262E;
  --ok:#7BD3A0; --okbg:#173A2B; --wait:#E8C46E; --waitbg:#3A2F17; --bad:#F09A9A; --badbg:#3D1E1E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
body.has-bar{padding-bottom:84px}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);line-height:1.4;text-wrap:balance;margin:0}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:8px}
svg.lucide{width:1em;height:1em;stroke-width:1.8}

/* الترويسة */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:14px;min-width:0;text-decoration:none}
.brand img{height:54px;width:auto;flex:none}
.brand .logo-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand .logo-l{display:none}:root:not([data-theme="light"]) .brand .logo-d{display:block}}
:root[data-theme="dark"] .brand .logo-l{display:none} :root[data-theme="dark"] .brand .logo-d{display:block}
.brand .gov{font-family:var(--f-display);font-size:13px;line-height:1.6;color:var(--muted);border-inline-start:1px solid var(--line);padding-inline-start:14px}
.brand .gov b{display:block;color:var(--ink);font-size:14px}
.top-actions{display:flex;align-items:center;gap:8px;flex:none}
.edition{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px}
.edition button{border:0;background:transparent;padding:5px 14px;border-radius:999px;cursor:pointer;font-family:var(--f-display);font-size:13px;color:var(--muted)}
.edition button[aria-pressed="true"]{background:var(--petrol);color:var(--onpetrol)}
.admin-link{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-family:var(--f-display);font-size:13px;text-decoration:none;color:var(--petrol);background:var(--surface)}
.admin-link:hover{background:var(--soft)}
.rule{height:4px;background:linear-gradient(90deg,var(--green),var(--teal) 55%,var(--petrol))}

/* لوحة التعريف */
.intro{padding-block:28px 8px}
.intro-grid{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:stretch}
.title-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 28px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0}
.title-card::after{content:"";position:absolute;inset:auto auto -60px -60px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,var(--soft) 0 2px,transparent 2.5px) 0 0/16px 16px;pointer-events:none}
.eyebrow{font-family:var(--f-display);font-size:13px;letter-spacing:.02em;color:var(--teal);font-weight:700}
.title-card h1{font-size:clamp(26px,3.4vw,36px);font-weight:800;color:var(--petrol);margin-block:4px 6px}
.title-card .lead{color:var(--muted);max-width:60ch;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:14px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;position:relative;z-index:1}
.stat{background:var(--soft);border-radius:12px;padding:10px 16px;min-width:120px}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--petrol);font-variant-numeric:tabular-nums;line-height:1.2}
.stat .k{font-size:13px;color:var(--muted)}
.qr-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;width:240px}
.qr-side{display:flex;flex-direction:column;gap:10px;width:100%}
.qr-box{background:#fff;padding:10px;border-radius:10px;border:1px solid var(--line);line-height:0}
.qr-box img,.qr-box canvas{width:132px!important;height:132px!important}
.qr-cap{font-size:13px;color:var(--muted);text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;padding:9px 16px;font-family:var(--f-display);font-weight:700;font-size:14.5px;text-decoration:none;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s;white-space:nowrap}
.btn-primary{background:var(--petrol);color:var(--onpetrol)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--soft)}
.btn-danger{background:var(--badbg);color:var(--bad)}
.btn[disabled],.btn[aria-disabled="true"]{background:var(--soft);color:var(--muted);cursor:default;filter:none;border-color:var(--line)}
.btn-block{width:100%}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:8px}
.icon-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.icon-btn[disabled]{opacity:.35;cursor:default}
.icon-btn.danger:hover{background:var(--badbg);color:var(--bad)}
.icon-btn.confirm{width:auto;padding-inline:10px;background:var(--bad);border-color:var(--bad);color:#fff;font-family:var(--f-display);font-size:12.5px}

/* أقسام وشبكة */
.tools{display:flex;align-items:center;justify-content:flex-end;padding-block:18px 0}
.search{position:relative;flex:0 1 320px;min-width:0}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 40px 9px 12px;font-size:15px}
.search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.section{padding-block:18px 6px}
.sec-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sec-head h2{font-size:20px}
.sec-head .count{font-size:13px;color:var(--muted)}
.sec-head p{flex-basis:100%;margin:0;color:var(--muted);font-size:14.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.grid{gap:18px}
.card{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 20px 16px;text-decoration:none;color:inherit;min-width:0;box-shadow:0 1px 2px rgba(15,78,92,.05);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.card::before{content:"";position:absolute;z-index:-1;inset:0 0 auto 0;height:96px;background:linear-gradient(180deg,var(--soft),transparent)}
.card::after{content:"";position:absolute;z-index:-1;inset:auto auto -46px -46px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--soft) 0 1.7px,transparent 2.2px) 0 0/12px 12px;opacity:0;transition:opacity .3s ease,transform .35s ease}
.card:hover{transform:translateY(-3px);border-color:var(--teal);box-shadow:0 12px 28px rgba(15,78,92,.13)}
.card:hover::after{opacity:1;transform:scale(1.12)}
.corner{position:absolute;top:0;left:0;min-width:48px;height:42px;padding-inline:12px;display:grid;place-items:center;background:var(--petrol);color:var(--onpetrol);font-family:var(--f-display);font-weight:800;font-size:16px;border-bottom-right-radius:18px;font-variant-numeric:tabular-nums}
.card-ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(140deg,var(--teal),var(--petrol));color:var(--onpetrol);box-shadow:0 8px 16px rgba(15,78,92,.18);transition:transform .25s ease}
.card-ico svg{width:26px;height:26px;stroke-width:1.7}
.card:hover .card-ico{transform:scale(1.06) rotate(-4deg)}
.card h3{font-size:16.5px;font-weight:700;line-height:1.6;min-height:3.2em}
.card h3 .sub{margin-top:2px}
.card-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.foot-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.go{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-display);font-size:13px;font-weight:700;color:var(--teal)}
.go svg{width:15px;height:15px;transition:transform .2s ease}
.card:hover .go svg{transform:translateX(-4px)}
.prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .bar{display:block;flex:1;width:auto;height:5px;background:var(--line)}
.ico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--petrol)}
.ico svg{width:22px;height:22px}
.card h3{font-size:16px;font-weight:700;line-height:1.55;flex:1;min-width:0}
.sub{display:block;font-family:var(--f-body);font-weight:400;font-size:12.5px;color:var(--muted)}
.num{flex:none;font-family:var(--f-display);font-weight:800;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:8px;padding:0 7px;line-height:24px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:500;white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.wait{background:var(--waitbg);color:var(--wait)}
.chip svg{width:13px;height:13px}
.meter{display:flex;align-items:center;gap:8px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{width:64px;height:6px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:6px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}

/* صفحة العنصر */
.crumbs{display:flex;align-items:center;gap:8px;padding-block:20px 10px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.crumbs a{text-decoration:none;color:var(--teal);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.el-head{background:var(--petrol);color:var(--onpetrol);border-radius:var(--r);padding:22px 24px;display:flex;align-items:center;gap:18px;position:relative;overflow:hidden}
.el-head::after{content:"";position:absolute;inset:0 auto 0 0;width:40%;background:radial-gradient(circle,rgba(255,255,255,.14) 0 1.6px,transparent 2px) 0 0/14px 14px;pointer-events:none}
.el-num{flex:none;width:64px;height:64px;border-radius:16px;border:1.5px solid currentColor;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:26px}
.el-head .eyebrow{color:inherit;opacity:.8}
.el-head h1{font-size:clamp(21px,2.8vw,28px);font-weight:800}
.el-head .sub{font-size:15px;color:inherit;opacity:.85}
.el-head .big-ico{margin-inline-start:auto;opacity:.9;flex:none}
.el-head .big-ico svg{width:46px;height:46px;stroke-width:1.4}
.el-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;padding-block:18px 10px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-size:17px;color:var(--petrol);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.panel h2 svg{width:20px;height:20px}
.panel p{margin:0;max-width:68ch}
.ind{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ind li{background:var(--soft);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;font-size:15px}
.ind li::before{content:"";flex:none;width:8px;height:8px;margin-top:9px;transform:rotate(45deg);background:var(--teal)}
.ev-note{font-size:13px;color:var(--muted);margin:-4px 0 10px!important}
.ev{list-style:none;margin:0;padding:0}
.ev li+li{border-top:1px solid var(--line)}
.ev label{display:flex;align-items:center;gap:12px;padding:10px 2px;cursor:pointer}
.ev input{appearance:none;flex:none;width:22px;height:22px;border:1.6px solid var(--line);border-radius:6px;background:var(--surface);display:grid;place-items:center;cursor:pointer;margin:0}
.ev input:checked{background:var(--green);border-color:var(--green)}
.ev input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.4px 2.4px 0;transform:translateY(-1px) rotate(45deg)}
.ev input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;flex-direction:column;gap:14px}
.side .panel{display:flex;flex-direction:column;gap:10px}
.side .qr-box{align-self:center}
.status{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.note-ok{font-size:13px;color:var(--ok);text-align:center;min-height:1.4em}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager a{display:flex;flex-direction:column;gap:2px;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted);background:var(--surface);min-width:0}
.pager a b{color:var(--ink);font-family:var(--f-display);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pager a:hover{border-color:var(--teal)}

/* لوحة التحكم */
.adm-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:22px 6px}
.adm-head h1{font-size:24px;color:var(--petrol);display:flex;align-items:center;gap:10px}
.adm-head p{margin:0;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-block:12px 18px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:10px 14px;cursor:pointer;font-family:var(--f-display);font-size:14.5px;color:var(--muted);border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tabs button[aria-selected="true"]{color:var(--petrol);border-bottom-color:var(--petrol);font-weight:700}
.sec-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.sec-card-head{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--soft);flex-wrap:wrap}
.sec-card-head .grow{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px}
.sec-card-head .acts{display:flex;gap:6px;flex-wrap:wrap}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.rows .r-name{flex:1;min-width:0;font-weight:500;line-height:1.5}
.rows .r-name small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.rows .acts{display:flex;gap:6px;flex:none}
.rows .ico{width:36px;height:36px;border-radius:10px}
.rows .ico svg{width:18px;height:18px}
.rows-empty{padding:16px;color:var(--muted);font-size:14px;text-align:center}
.sec-foot{padding:12px 16px;border-top:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font-family:var(--f-display);font-size:13.5px;font-weight:700;color:var(--ink)}
.field .hint{font-size:12.5px;color:var(--muted)}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:15px;line-height:1.6}
.in:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 22%,transparent)}
textarea.in{min-height:96px;resize:vertical}
.in.ltr{direction:ltr;text-align:left}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.form-grid .full{grid-column:1/-1}
.link-row{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr) auto;gap:8px;align-items:center}
.links-ed{display:flex;flex-direction:column;gap:8px}
.icon-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;max-height:156px;overflow:auto;padding:4px;border:1px solid var(--line);border-radius:10px}
.icon-grid button{height:40px;border:1px solid transparent;border-radius:8px;background:transparent;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.icon-grid button:hover{background:var(--soft)}
.icon-grid button[aria-pressed="true"]{border-color:var(--petrol);background:var(--soft);color:var(--petrol)}
.icon-grid svg{width:20px;height:20px}
.msg{font-size:13.5px;border-radius:10px;padding:10px 12px}
.msg.err{background:var(--badbg);color:var(--bad)}
.msg.info{background:var(--soft);color:var(--ink)}
.drawer-bg{position:fixed;inset:0;background:rgba(8,28,34,.45);z-index:40;display:flex;justify-content:flex-start}
.drawer{background:var(--bg);width:min(640px,100%);height:100%;overflow:auto;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.25)}
.drawer-head{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 14px) max(18px,env(safe-area-inset-right,0px)) 14px max(18px,env(safe-area-inset-left,0px))}
.drawer-head h2{font-size:18px;color:var(--petrol)}
.drawer-body{padding:18px max(18px,env(safe-area-inset-right,0px)) 18px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;flex:1}
.drawer-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px;padding:12px max(18px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.savebar{position:fixed;inset:auto 0 0 0;z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(15,78,92,.08);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{display:flex;align-items:center;gap:10px;padding-block:12px;flex-wrap:wrap}
.savebar .txt{flex:1;min-width:180px;font-size:14px;display:flex;align-items:center;gap:8px}
.savebar .dot{width:9px;height:9px;border-radius:50%;background:var(--wait);flex:none}
.savebar .txt small{color:var(--muted)}
.banner{background:var(--waitbg);color:var(--ink);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px;font-size:14px}
.banner .grow{flex:1;min-width:200px}

footer{margin-top:28px;border-top:1px solid var(--line);background:var(--surface)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding-block:16px;font-size:13px;color:var(--muted)}

@media (max-width:860px){
  .intro-grid{grid-template-columns:1fr}
  .qr-card{width:auto;flex-direction:row;justify-content:flex-start}
  .qr-side{flex:1;min-width:0}
  .el-body{grid-template-columns:1fr}
  .side{position:static;order:-1}
  .ind{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
}
@media (max-width:560px){
  .brand img{height:44px}
  .brand .gov{display:none}
  .title-card{padding:20px}
  .qr-box img,.qr-box canvas{width:104px!important;height:104px!important}
  .el-head{padding:18px;gap:14px}
  .el-num{width:52px;height:52px;font-size:21px}
  .el-head .big-ico{display:none}
  .grid{grid-template-columns:1fr}
  .admin-link span{display:none}
  .rows li{flex-wrap:wrap}
  .rows .acts{width:100%;justify-content:flex-end}
  .link-row{grid-template-columns:1fr auto}
  .link-row .in:first-child{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== الهيكل: شريط جانبي + عمود المحتوى ===== */
:root{ --nav-a:#0E4A57; --nav-b:#1B6B57; --nav-ink:#F2FAF8; --nav-dim:rgba(242,250,248,.78); --nav-on:rgba(255,255,255,.16); --nav-line:rgba(255,255,255,.14); --info:#0F4E5C; --infobg:#E3EEF0 }
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){ --nav-a:#0A2128; --nav-b:#0F3A31; --info:#8CCBD6; --infobg:#173039 }}
:root[data-theme="dark"]{ --nav-a:#0A2128; --nav-b:#0F3A31; --info:#8CCBD6; --infobg:#173039 }
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--surface)}
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(175deg,var(--nav-a),var(--nav-b));color:var(--nav-ink);display:flex;flex-direction:column;gap:18px;padding:22px 14px 18px}
.nav-brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;padding:4px 8px 16px;border-bottom:1px solid var(--nav-line)}
.nav-brand img{height:46px;width:auto;flex:none}
.nav-brand span{display:flex;flex-direction:column;min-width:0;line-height:1.5}
.nav-brand b{font-family:var(--f-display);font-size:14.5px}
.nav-brand small{font-size:12px;color:var(--nav-dim)}
.nav-list{display:flex;flex-direction:column;gap:4px}
.nav-list a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--nav-dim);text-decoration:none;font-family:var(--f-display);font-size:15px;transition:background .15s,color .15s}
.nav-list a svg{width:19px;height:19px;flex:none}
.nav-list a:hover{background:rgba(255,255,255,.08);color:var(--nav-ink)}
.nav-list a.on{background:var(--nav-on);color:#fff;font-weight:700;box-shadow:inset 0 0 0 1px var(--nav-line)}
.nav-list a:focus-visible{outline-color:#fff}
.nav-foot{margin-top:auto;font-size:12.5px;color:var(--nav-dim);padding:12px 8px 0;border-top:1px solid var(--nav-line)}
.main-col{min-width:0;display:flex;flex-direction:column}
.main-col main{flex:1}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.tb-title{flex:1;display:flex;align-items:center;gap:14px;min-width:0}
.tb-title b{font-family:var(--f-display);font-size:17px;color:var(--petrol);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none}
.scrim{position:fixed;inset:0;background:rgba(6,24,29,.5);z-index:45}
.save-state{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.save-state svg{width:15px;height:15px}
.save-state.saved{color:var(--ok)} .save-state.error{color:var(--bad)} .save-state.pending{color:var(--wait)}
.page{padding-block:22px 12px;display:flex;flex-direction:column;gap:16px}
.page>.panel+.panel{margin-top:0}
@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  .nav{position:fixed;inset:0 0 0 auto;width:min(290px,86vw);height:auto;z-index:50;transform:translateX(105%);transition:transform .25s ease;padding-top:calc(env(safe-area-inset-top,0px) + 18px);padding-right:max(14px,env(safe-area-inset-right,0px))}
  .nav.open{transform:none;box-shadow:-10px 0 40px rgba(0,0,0,.3)}
  .menu-btn{display:inline-grid}
}

/* ===== عناوين الصفحات ===== */
.pg-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.pg-title{display:flex;align-items:center;gap:14px;min-width:0}
.pg-ico{flex:none;width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(140deg,var(--teal),var(--petrol));color:var(--onpetrol)}
.pg-ico svg{width:24px;height:24px}
.pg-title h1{font-size:23px;color:var(--ink)}
.pg-title p{margin:0;color:var(--muted);font-size:14.5px}
.pg-acts{display:flex;gap:8px;flex-wrap:wrap}

/* ===== الرئيسية ===== */
.welcome{position:relative;overflow:hidden;border-radius:18px;padding:26px 28px;background:linear-gradient(120deg,var(--nav-a),var(--nav-b));color:#fff;display:flex;align-items:center;justify-content:space-between;gap:18px}
.welcome::after{content:"";position:absolute;inset:0 auto 0 0;width:45%;background:radial-gradient(circle,rgba(255,255,255,.12) 0 1.6px,transparent 2px) 0 0/14px 14px;pointer-events:none}
.welcome .eyebrow{color:rgba(255,255,255,.8)}
.welcome h1{font-size:clamp(22px,3vw,30px);font-weight:800;margin-block:2px 6px}
.welcome p{margin:0;color:rgba(255,255,255,.88);font-size:14.5px}
.welcome-logo{height:84px;width:auto;position:relative;z-index:1;opacity:.95}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s,box-shadow .15s}
.tile:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:var(--shadow)}
.tile-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--soft);color:var(--petrol);margin-bottom:6px}
.tile-ico svg{width:19px;height:19px}
.tile-v{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--petrol);line-height:1.2;font-variant-numeric:tabular-nums}
.tile-k{font-size:13.5px;color:var(--muted)}
.dash-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.dash-grid .panel{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.dash-grid .panel p{margin:0}
.plist{list-style:none;margin:0;padding:0;width:100%}
.plist li{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.plist li:first-child{border-top:0}
.pchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pchip{background:var(--soft);color:var(--ink);border-radius:999px;padding:2px 11px;font-size:13px;white-space:nowrap}
.muted{color:var(--muted)}
.bar.wide{display:block;width:100%;height:8px;background:var(--line)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.info{background:var(--infobg);color:var(--info)}
.muted-panel,.lock-panel,.empty-panel{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.muted-panel{color:var(--muted)}
.lock-panel>svg,.empty-panel>svg{width:32px;height:32px;color:var(--teal);flex:none}
.lock-panel>div,.empty-panel>div{flex:1;min-width:220px}
.lock-panel h2,.empty-panel h2{margin-bottom:4px}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--teal);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== الجداول والأدوات ===== */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.toolbar .search{flex:1 1 240px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{background:var(--soft);font-family:var(--f-display);font-weight:700;font-size:13.5px;text-align:right;padding:10px 12px;white-space:nowrap;color:var(--petrol)}
.tbl td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
.tbl td.n{color:var(--muted);width:44px;font-variant-numeric:tabular-nums}
.tbl .num-c{text-align:center;font-variant-numeric:tabular-nums}
.tbl td.acts{white-space:nowrap;text-align:left}
.tbl td.acts>*+*{margin-inline-start:6px}
.tbl tbody tr:hover td{background:color-mix(in srgb,var(--soft) 45%,transparent)}
.hot-bad{color:var(--bad);font-weight:700}
.hot-wait{color:var(--wait);font-weight:700}
.ltr{direction:ltr;text-align:right}
.mini{display:inline-flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-family:var(--f-display)}
.mini .in{padding:6px 10px;font-size:14px}

/* ===== شريط التاريخ ===== */
.datebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:14px}
.dpick{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:4px 10px;color:var(--muted)}
.dpick svg{width:17px;height:17px}
.dpick input{border:0;background:transparent;font:inherit;color:var(--ink);padding:4px 0}
.dtxt{display:flex;flex-direction:column;line-height:1.5;flex:1;min-width:180px}
.dtxt b{font-family:var(--f-display)}
.dtxt span{font-size:13px;color:var(--muted)}
.sumbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sumbar .muted{font-size:13.5px;margin-inline-end:auto}

/* ===== أزرار الحالة ===== */
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-inline-start:1px solid var(--line);background:transparent;padding:7px 12px;font-size:13.5px;cursor:pointer;color:var(--muted);font-family:var(--f-display);white-space:nowrap}
.seg button:first-child{border-inline-start:0}
.seg button:hover:not([disabled]){background:var(--soft);color:var(--ink)}
.seg button[disabled]{cursor:default}
.seg button.ok[aria-pressed="true"]{background:var(--okbg);color:var(--ok);font-weight:700}
.seg button.wait[aria-pressed="true"]{background:var(--waitbg);color:var(--wait);font-weight:700}
.seg button.bad[aria-pressed="true"]{background:var(--badbg);color:var(--bad);font-weight:700}
.seg button.info[aria-pressed="true"]{background:var(--infobg);color:var(--info);font-weight:700}
.seg.rating button[aria-pressed="true"]{background:var(--petrol);color:var(--onpetrol);font-weight:700}

/* ===== الحضور ===== */
.att-list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.att-row{display:grid;grid-template-columns:minmax(190px,1fr) auto minmax(200px,1fr);gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.att-row:first-child{border-top:0}
.att-row .seg{justify-self:start}
.att-name{display:flex;align-items:center;gap:10px;min-width:0}
.att-name .n{color:var(--muted);font-size:13px;width:24px;flex:none;font-variant-numeric:tabular-nums}
.att-name small{display:block;color:var(--muted);font-size:12.5px}
.att-extra{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;min-width:0}
.att-extra>.in{flex:1;min-width:140px;padding:7px 10px;font-size:14px}
@media (max-width:1100px){.att-row{grid-template-columns:1fr}}

/* ===== النماذج ===== */
.form-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.form-cols .full{grid-column:1/-1}
.form-cols .panel{display:flex;flex-direction:column;gap:12px}
.form-cols .panel h2{margin-bottom:0}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.pick input{accent-color:var(--petrol);width:18px;height:18px;flex:none}
.pick span{display:flex;flex-direction:column;line-height:1.5}
.pick small{color:var(--muted);font-size:12px}
.pick-list{display:flex;flex-direction:column;gap:6px}
.late-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.late-form .wide{grid-column:span 2}
.grid-tbl td{min-width:130px}
.cell{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:34px}
.cell-edit{margin-inline-start:auto;border:1px dashed var(--line);background:transparent;border-radius:8px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.cell-edit:hover{border-color:var(--teal);color:var(--teal)}
.cell-edit svg{width:15px;height:15px}
.slot-h{text-align:right;white-space:nowrap;background:var(--soft);color:var(--petrol);font-family:var(--f-display)}
.tbl td .slot-h,.tbl th.slot-h{border-top:1px solid var(--line)}
.slot-in{padding:6px 10px;font-size:14px;min-width:150px}
.slot-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.slot-tools .in{max-width:280px;padding:7px 10px;font-size:14px}
.follow-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.follow-row:first-of-type{border-top:0}
.follow-row>b{flex:1;min-width:150px}
.follow-row.duty>.in{flex:1;min-width:160px;padding:7px 10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.toast.ok{background:var(--ok);color:#fff}
.toast.err{background:var(--bad);color:#fff}
@media (max-width:760px){
  .dash-grid,.form-cols,.checks{grid-template-columns:1fr}
  .welcome{padding:20px}
  .welcome-logo{height:56px}
  .late-form .wide{grid-column:auto}
  .pg-title h1{font-size:20px}
  .edition button{padding:5px 10px}
}

/* ===== أفكار الفيديو: البحث، التنبيهات، الوضع الليلي، الصور الرمزية ===== */
.avatar{flex:none;width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;background:linear-gradient(140deg,var(--teal),var(--petrol));color:var(--onpetrol);font-family:var(--f-display);font-weight:700;font-size:12.5px;letter-spacing:0;line-height:1}
.avatar.lg{width:58px;height:58px;font-size:18px}
.gsearch{position:relative;flex:0 1 340px;min-width:0}
.gsearch>svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted);pointer-events:none}
.gsearch input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 38px 8px 14px;font-size:14px}
.gsearch input:focus{outline:none;border-color:var(--teal);background:var(--surface)}
.gres{position:absolute;top:calc(100% + 6px);inset-inline:0;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(8,30,36,.16);padding:6px;max-height:360px;overflow:auto}
.gr{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:10px;cursor:pointer;text-align:right}
.gr:hover,.gr:focus-visible{background:var(--soft)}
.gr>svg{width:16px;height:16px;color:var(--teal);flex:none;margin-inline:9px}
.gr span:not(.avatar){display:flex;flex-direction:column;line-height:1.5;min-width:0}
.gr small{color:var(--muted);font-size:12px}
.gr-empty{padding:10px;margin:0;font-size:13.5px}
.bell-wrap{position:relative}
.badge{position:absolute;top:-5px;left:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.bell-pop{position:absolute;top:calc(100% + 8px);left:0;z-index:30;width:min(320px,86vw);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(8,30,36,.16);padding:8px}
.pop-title{display:block;font-family:var(--f-display);padding:6px 8px 8px;color:var(--petrol)}
.pop-item{display:flex;align-items:flex-start;gap:10px;padding:9px 8px;border-radius:10px;text-decoration:none;font-size:14px;line-height:1.55}
.pop-item:hover{background:var(--soft)}
.pop-item svg{width:17px;height:17px;color:var(--teal);flex:none;margin-top:3px}
.bell-pop .muted{padding:8px;margin:0;font-size:14px}
.me-chip{display:inline-flex;align-items:center;gap:8px;padding:3px 4px 3px 12px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;font-family:var(--f-display);white-space:nowrap}
.me-chip .avatar{width:28px;height:28px;font-size:11px}
.nav-foot{display:flex;flex-direction:column;gap:10px}
.nav-me{display:flex;align-items:center;gap:10px}
.nav-me span:last-child{display:flex;flex-direction:column;line-height:1.45}
.nav-me b{color:var(--nav-ink);font-family:var(--f-display);font-size:13.5px}
.nav-me .avatar{background:rgba(255,255,255,.16);color:#fff}
.who{display:inline-flex;align-items:center;gap:10px}
.who .avatar{width:28px;height:28px;font-size:11px}
.name-btn{display:inline-flex;align-items:center;gap:10px;border:0;background:transparent;padding:0;cursor:pointer;text-align:right}
.name-btn span:not(.avatar){display:flex;flex-direction:column;line-height:1.45}
.name-btn small{color:var(--muted);font-size:12px}
.name-btn:hover b{color:var(--teal);text-decoration:underline}
.sel-sm{width:auto;padding:7px 10px;font-size:14px}
/* الرئيسية */
.tiles.six{grid-template-columns:repeat(6,minmax(0,1fr))}
.tile.ok .tile-ico{background:var(--okbg);color:var(--ok)}
.tile.bad .tile-ico{background:var(--badbg);color:var(--bad)}
.tile.wait .tile-ico{background:var(--waitbg);color:var(--wait)}
.sec-title{font-size:18px;margin-bottom:12px;color:var(--ink)}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.mod{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s,box-shadow .15s}
.mod:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:var(--shadow)}
.mod-ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--soft);color:var(--petrol);margin-bottom:4px}
.mod-ico svg{width:22px;height:22px}
.mod b{font-family:var(--f-display);font-size:15.5px}
.mod>span:last-child{font-size:13px;color:var(--muted);line-height:1.6}
.week-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.week-head h2{margin-bottom:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:11px;height:11px;border-radius:3px;display:inline-block}
.lg.ok{background:var(--ok)} .lg.wait{background:var(--wait)} .lg.bad{background:var(--bad)}
.week-chart{overflow-x:auto;margin-top:10px}
.week-chart svg{width:100%;min-width:520px;height:auto;display:block}
.week-chart .gl{stroke:var(--line);stroke-width:1}
.week-chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.week-chart .b-ok{fill:var(--ok)} .week-chart .b-wait{fill:var(--wait)} .week-chart .b-bad{fill:var(--bad)}
.week-chart .bv{fill:var(--ink);font-size:11px;text-anchor:middle;font-family:var(--f-body)}
.week-chart .dl{fill:var(--ink);font-size:13px;text-anchor:middle;font-family:var(--f-display);font-weight:700}
.week-chart .dl.now{fill:var(--teal)}
.week-chart .dc{fill:var(--muted);font-size:10.5px;text-anchor:middle;font-family:var(--f-body)}
/* ملف الموظف */
.prof-head{display:flex;align-items:center;gap:14px}
.prof-head h3{font-size:19px}
.prof-head p{margin:0}
.prof-dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
.prof-dl div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.prof-dl .wide{grid-column:1/-1}
.prof-dl dt{font-size:12.5px;color:var(--muted)}
.prof-dl dd{margin:0;font-weight:600}
.panel .prof-dl div{background:var(--soft);border-color:transparent}
.mini-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mt{border-radius:12px;padding:10px;background:var(--soft);display:flex;flex-direction:column;gap:2px}
.mt b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.mt span{font-size:12px;color:var(--muted);line-height:1.4}
.mt.ok b{color:var(--ok)} .mt.wait b{color:var(--wait)} .mt.bad b{color:var(--bad)} .mt.info b{color:var(--info)}
/* الاستيراد والتصدير */
.io-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.exp-list{display:flex;flex-direction:column;gap:8px}
.exp-list .btn{justify-content:flex-start}
@media (max-width:1200px){.tiles.six{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:980px){.me-name{display:none}.me-chip{padding:3px}}
@media (max-width:760px){
  .tb-title{display:none}
  .gsearch{flex:1}
  .me-chip{display:none}
  .tiles.six{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mini-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prof-dl{grid-template-columns:1fr}
}

.me-chip[hidden],.badge[hidden],.gres[hidden],.bell-pop[hidden]{display:none}
@media (max-width:760px){.topbar-in{flex-wrap:wrap;row-gap:8px}.gsearch{order:5;flex:1 1 100%}.top-actions{margin-inline-start:auto}}
.name-btn b{white-space:nowrap}
.rule-note{display:flex;align-items:center;gap:6px;font-size:13px;margin:-4px 0 12px}
.rule-note svg{width:15px;height:15px;color:var(--teal);flex:none}
.device-note{display:flex;align-items:center;gap:8px}
.device-note svg{width:17px;height:17px;color:var(--teal);flex:none}

/* ===== الشريط التحفيزي ===== */
:root{ --gold:#B08A2E; --goldbg:#F7EFD9 }
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){ --gold:#E2C16E; --goldbg:#3A3017 }}
:root[data-theme="dark"]{ --gold:#E2C16E; --goldbg:#3A3017 }
.ticker{position:relative;display:flex;align-items:stretch;background:linear-gradient(90deg,var(--nav-b),var(--nav-a));color:#fff;height:46px;border-bottom:2px solid #D9B45A;overflow:hidden}
.ticker[hidden]{display:none}
.tk-lead{flex:none;position:relative;display:flex;align-items:center;gap:9px;padding:0 18px 0 30px;background:linear-gradient(100deg,#C59B3E,#ECCD7E 45%,#C59B3E);background-size:220% 100%;color:#2A2006;font-family:var(--f-display);font-weight:800;font-size:15px;white-space:nowrap;clip-path:polygon(16px 0,100% 0,100% 100%,16px 100%,0 50%);animation:tkShine 7s ease-in-out infinite}
.tk-lead svg{width:19px;height:19px;flex:none}
.tk-lead.tk-icon-only{padding:0 14px 0 26px}
@keyframes tkShine{0%,70%{background-position:100% 0}100%{background-position:-120% 0}}
.tk-rot{flex:1;position:relative;min-width:0;overflow:hidden}
.tk-cur{position:absolute;top:0;bottom:0;right:18px;left:18px;display:flex;align-items:center;gap:10px;margin:0;padding:0;border:0;background:none;color:#fff;font-family:var(--f-display);font-size:15px;line-height:1.4;white-space:nowrap}
.tk-txt{overflow:hidden;text-overflow:ellipsis}
.tk-cur.tk-main{color:#F7E3A6;font-weight:800}
.tk-cur.tk-enter{animation:tkEnter .55s cubic-bezier(.2,.8,.2,1) both}
.tk-cur.tk-leave{animation:tkLeave .45s ease both}
@keyframes tkEnter{from{opacity:0;transform:translateY(70%)}to{opacity:1;transform:none}}
@keyframes tkLeave{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-70%)}}
.tk-dot{width:8px;height:8px;transform:rotate(45deg);background:#F3D27A;display:inline-block;flex:none}
.tk-dots{flex:none;display:flex;align-items:center;gap:5px;padding:0 16px}
.tk-dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.35);transition:width .3s,background .3s}
.tk-dots i.on{width:18px;background:#F3D27A}
@media (max-width:640px){
  .ticker{height:44px}
  .tk-cur{right:12px;left:12px;font-size:14.5px}
  .tk-dots{padding:0 12px;gap:4px}
  .tk-dots i{width:5px;height:5px}
  .tk-dots i.on{width:12px}
}
@media (prefers-reduced-motion:reduce){.tk-lead{animation:none}.tk-cur.tk-enter,.tk-cur.tk-leave{animation:none}.tk-cur.tk-leave{display:none}}

/* ===== ملف المدرسة ===== */
.pf-hero,.ach-hero{position:relative;overflow:hidden;border-radius:18px;padding:24px 28px;background:linear-gradient(120deg,var(--nav-a),var(--nav-b));color:#fff;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.pf-hero::after,.ach-hero::after{content:"";position:absolute;inset:0 auto 0 0;width:45%;background:radial-gradient(circle,rgba(255,255,255,.12) 0 1.6px,transparent 2px) 0 0/14px 14px;pointer-events:none}
.pf-hero .eyebrow{color:rgba(255,255,255,.8)}
.pf-hero h1,.ach-hero h1{font-size:clamp(22px,3vw,30px);font-weight:800;margin-block:2px 4px}
.pf-hero p,.ach-hero p{margin:0;color:rgba(255,255,255,.88)}
.btn-light{background:#fff;color:var(--nav-a);position:relative;z-index:1}
.btn-light:hover{filter:brightness(.96)}
.pf-layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
.pf-tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px}
.pf-tabs button{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:9px 10px;border-radius:10px;cursor:pointer;text-align:right;font-family:var(--f-display);font-size:14px;color:var(--ink);line-height:1.45}
.pf-tabs button svg{width:17px;height:17px;color:var(--teal);flex:none}
.pf-tabs button:hover{background:var(--soft)}
.pf-tabs button[aria-current="true"]{background:var(--petrol);color:var(--onpetrol)}
.pf-tabs button[aria-current="true"] svg{color:var(--onpetrol)}
.pf-n{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;background:var(--soft);color:var(--muted);font-variant-numeric:tabular-nums}
.pf-tabs button[aria-current="true"] .pf-n{background:rgba(255,255,255,.2);color:var(--onpetrol)}
.pf-body{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;min-width:0;display:flex;flex-direction:column;gap:16px}
.pf-title{font-size:20px;color:var(--petrol);display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.pf-title svg{width:22px;height:22px}
.sub-h{font-size:16.5px;color:var(--ink);display:flex;align-items:center;gap:8px;margin-top:6px}
.sub-h svg{width:18px;height:18px;color:var(--teal)}
.small-note{font-size:13px;display:flex;align-items:center;gap:6px;margin:0}
.small-note svg{width:15px;height:15px;color:var(--teal)}
.leaders{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.leader{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:14px;padding:12px 14px}
.leader .avatar{width:44px;height:44px;font-size:14px}
.leader div{display:flex;flex-direction:column;line-height:1.5;min-width:0}
.leader div>span{font-size:12.5px;color:var(--muted)}
.leader b{font-family:var(--f-display);font-size:15.5px}
.leader.big{background:transparent;padding:0}
.counts{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.count{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.count b{font-family:var(--f-display);font-size:26px;color:var(--petrol);font-variant-numeric:tabular-nums;line-height:1.2}
.count span{font-size:13px;color:var(--muted)}
.count.total{background:var(--petrol);border-color:var(--petrol)}
.count.total b,.count.total span{color:var(--onpetrol)}
.names-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.names{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.names-head{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--soft);padding:10px 14px;font-family:var(--f-display)}
.names-head .muted{font-size:13px;font-family:var(--f-body)}
.names-list{margin:0;padding:6px 14px 10px 14px;padding-inline-start:44px;columns:2;column-gap:28px;font-size:14.5px}
.names-list li{padding:5px 0;border-bottom:1px dashed var(--line);break-inside:avoid}
.names-list li.empty span{color:var(--line);letter-spacing:1px}
.names-list li::marker{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.goal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.goal{display:flex;gap:12px;background:var(--soft);border-radius:14px;padding:14px}
.goal-n{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--petrol);color:var(--onpetrol);font-family:var(--f-display);font-weight:800;font-size:14px}
.goal b{font-family:var(--f-display);font-size:15px;display:block;margin-bottom:2px}
.goal p{margin:0;font-size:14px;color:var(--muted);line-height:1.7}
.goal-link{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--teal);margin-top:6px}
.goal-link svg{width:13px;height:13px}
.check-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.check-list li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:14.5px}
.check-list li::before{content:"";flex:none;width:9px;height:9px;margin-top:9px;transform:rotate(45deg);background:var(--gold)}
.vision{position:relative;margin:0;background:linear-gradient(135deg,var(--soft),var(--surface));border:1px solid var(--line);border-radius:16px;padding:22px 24px 22px 24px}
.vision>svg{position:absolute;top:14px;left:16px;width:34px;height:34px;color:var(--line)}
.vision p{margin:0;font-family:var(--f-display);font-size:17.5px;line-height:1.95;color:var(--petrol);max-width:none}
.vision.alt p{color:var(--ink)}
.bio p{margin:0 0 10px}
.info-dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}
.info-dl div{border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.info-dl dt{font-size:12.5px;color:var(--muted)}
.info-dl dd{margin:0;font-family:var(--f-display);font-size:15.5px}
.link-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.link-card{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none}
.link-card:hover{border-color:var(--teal);background:var(--soft)}
.link-card span{flex:1;font-family:var(--f-display)}
.link-card svg{width:18px;height:18px;color:var(--teal);flex:none}
.about{display:flex;gap:18px;align-items:center;background:var(--soft);border-radius:16px;padding:20px}
.about-num{flex:none;width:86px;height:86px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(140deg,var(--teal),var(--petrol));color:var(--onpetrol);font-family:var(--f-display);font-weight:800;font-size:40px}
.about p{margin:0;font-size:16px;line-height:2}
.soon{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1.5px dashed var(--line);border-radius:14px;padding:18px}
.soon>svg{width:28px;height:28px;color:var(--gold);flex:none}
.soon div{flex:1;min-width:200px;display:flex;flex-direction:column}
.soon b{font-family:var(--f-display);color:var(--ink)}
.soon span{font-size:14px;color:var(--muted)}

/* ===== الإنجازات ===== */
.chip.light{background:rgba(255,255,255,.16);color:#fff;padding:3px 12px}
.ach-hero-t{position:relative;z-index:1;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.ach-hero-r{position:relative;z-index:1;background:rgba(255,255,255,.1);border-radius:50%;padding:6px}
.ach-hero .ring-bg{stroke:rgba(255,255,255,.18)}
.ach-hero .ring-fg{stroke:#F3D27A}
.ach-hero .ring-v,.ach-hero .ring-k{fill:#fff}
.ring{display:block}
.ring-bg{fill:none;stroke:var(--soft);stroke-width:11}
.ring-fg{fill:none;stroke:var(--ok);stroke-width:11;stroke-linecap:round}
.ring-v{text-anchor:middle;font-family:var(--f-display);font-weight:800;font-size:24px;fill:var(--petrol)}
.ring-k{text-anchor:middle;font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.lvl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.lvl-ring{display:flex;flex-direction:column;align-items:center;gap:8px}
.lvl-chip svg{width:14px;height:14px}
.lvl-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lvl-stat{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.lvl-stat b{font-family:var(--f-display);font-size:28px;color:var(--petrol);line-height:1.1;font-variant-numeric:tabular-nums}
.lvl-stat b small{font-size:15px;color:var(--muted);font-weight:700}
.lvl-stat>span:not(.pbar){font-size:13.5px;color:var(--muted)}
.pbar{position:relative;display:block;height:9px;border-radius:9px;background:var(--soft);overflow:visible;flex:1;min-width:80px}
.pbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--teal),var(--ok))}
.pbar.gold i{background:linear-gradient(90deg,var(--gold),#D9B45A)}
.pbar.thin{height:6px}
.pbar-mark{position:absolute;top:-3px;bottom:-3px;right:90%;width:2px;background:var(--petrol);border-radius:2px;opacity:.55}
.lvl-stat .pbar .pbar-mark{display:none}
.pbar:not(:has(.pbar-mark)) {}
.dom-bars{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.dom-row{display:grid;grid-template-columns:200px minmax(0,1fr) 72px;gap:14px;align-items:center}
.dom-k{display:flex;flex-direction:column;line-height:1.45}
.dom-k b{font-family:var(--f-display)}
.dom-k small{color:var(--muted);font-size:12.5px}
.dom-v{font-family:var(--f-display);font-size:17px;color:var(--petrol);text-align:left;font-variant-numeric:tabular-nums}
.mark-key{display:inline-block;width:2px;height:13px;background:var(--petrol);opacity:.55;border-radius:2px}
.top-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.top-list li{display:grid;grid-template-columns:34px minmax(0,1.4fr) minmax(0,1fr) 70px;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--goldbg)}
.top-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#fff;font-family:var(--f-display);font-weight:800;font-size:14px}
.top-t{font-family:var(--f-display);font-size:14.5px}
.top-list li>b{font-family:var(--f-display);color:var(--gold);text-align:left;font-variant-numeric:tabular-nums}
.top-list .pbar{background:rgba(176,138,46,.15)}
.det-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.det{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.det-head{display:flex;align-items:center;gap:12px}
.det-ico{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(140deg,var(--teal),var(--petrol));color:var(--onpetrol)}
.det-ico svg{width:22px;height:22px}
.det-head div{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.5}
.det-head h3{font-size:16.5px}
.det-head span{font-size:12.5px;color:var(--muted)}
.det-v{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--ok);font-variant-numeric:tabular-nums}
.det ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.det li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:14px;line-height:1.6}
.det li>b{font-family:var(--f-display);font-variant-numeric:tabular-nums;color:var(--petrol)}
.det li .pbar{grid-column:1/-1;height:6px}
.values .val-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.values h2{margin-bottom:2px}
.val-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.val{background:var(--soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.val b{font-family:var(--f-display);font-size:22px;color:var(--ok);font-variant-numeric:tabular-nums}
.val span{font-size:13.5px;line-height:1.55}
.nafs-grades{display:flex;flex-direction:column;gap:16px;margin-top:10px}
.nafs-g h3{font-size:16px;margin-bottom:10px;color:var(--ink)}
.nafs-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.nafs-c{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px}
.nafs-s{font-family:var(--f-display);font-weight:700;color:var(--petrol)}
.nafs-avg{font-family:var(--f-display);font-size:30px;line-height:1.15;font-variant-numeric:tabular-nums}
.nafs-c>.muted{font-size:12.5px}
.delta{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;border-radius:999px;padding:2px 10px;width:fit-content;font-variant-numeric:tabular-nums}
.delta svg{width:14px;height:14px}
.delta.up{background:var(--okbg);color:var(--ok)}
.delta.down{background:var(--badbg);color:var(--bad)}
.mast{display:flex;flex-direction:column;gap:5px;margin-top:6px;font-size:13px;color:var(--muted)}
.sustain{border-radius:18px;padding:22px 24px;background:var(--goldbg);border:1px solid rgba(176,138,46,.25)}
.sustain h2{font-size:19px;display:flex;align-items:center;gap:8px;color:var(--gold);margin-bottom:12px}
.sustain h2 svg{width:22px;height:22px}
.sus-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.sus-cols h3{font-size:16px;margin-bottom:8px}
.sus-cols ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.sus-cols li{background:var(--surface);border-radius:12px;padding:10px 14px;font-family:var(--f-display);font-size:14.5px;display:flex;gap:10px;align-items:center}
.sus-cols li::before{content:"";width:9px;height:9px;transform:rotate(45deg);background:var(--gold);flex:none}
.thanks{text-align:center;border-radius:18px;padding:28px 20px;background:linear-gradient(120deg,var(--nav-a),var(--nav-b));color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px}
.thanks>svg{width:34px;height:34px;color:#F3D27A}
.thanks h2{font-size:clamp(20px,2.6vw,26px)}
.thanks p{margin:0;color:rgba(255,255,255,.85)}
@media (max-width:1050px){.det-grid{grid-template-columns:1fr}.val-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .pf-layout{grid-template-columns:1fr}
  .pf-tabs{position:static;flex-direction:row;overflow-x:auto;scrollbar-width:thin}
  .pf-tabs button{white-space:nowrap;flex:none}
  .lvl{grid-template-columns:1fr;justify-items:center}
  .lvl-stats{width:100%}
}
@media (max-width:640px){
  .names-grid,.goal-grid,.info-dl,.sus-cols{grid-template-columns:1fr}
  .names-list{columns:1}
  .lvl-stats{grid-template-columns:1fr}
  .dom-row{grid-template-columns:1fr 64px}
  .dom-row .pbar{grid-column:1/-1;grid-row:2}
  .top-list li{grid-template-columns:30px minmax(0,1fr) 62px}
  .top-list li .pbar{grid-column:2/-1}
  .about{flex-direction:column;text-align:center}
  .pf-body{padding:18px}
}
.edition[hidden],.ticker[hidden]{display:none}

/* حماية الدائرة الرمزية من القواعد العامة */
span.avatar{display:inline-grid;place-items:center;color:var(--onpetrol);line-height:1;text-align:center;white-space:nowrap}
.pf-hero-acts{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
.btn-outline-light{background:transparent;border-color:rgba(255,255,255,.55);color:#fff;position:relative;z-index:1}
.btn-outline-light:hover{background:rgba(255,255,255,.12)}
.pf-title .folder-btn{margin-inline-start:auto;font-size:13px}
.folder-btn svg{width:16px;height:16px}
.ach-hero-t .folder-btn{margin-top:6px}
.exp-list+div .folder-btn,.panel .folder-btn{align-self:flex-start}

/* ===================== التصميم ٢: بطاقات فاتحة، أزرار كبسولية، أخضر الهوية ===================== */
/* تخطيط: شريط علوي بأزرار كبسولية + شبكة بطاقات بزوايا كبيرة وظلال ناعمة (مستوحى من لوحات المتابعة الحديثة) */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --soft:#F2F6F4; --line:#E2E9E5;
  --ink:#17221E; --muted:#6B7B74;
  --petrol:#12875C; --teal:#1BA572; --green:#1BA572; --onpetrol:#FFFFFF;
  --lime:#E4EE6A; --limebg:#F6F9D6; --lime-ink:#5B6410;
  --ok:#14895E; --okbg:#E3F4EC; --wait:#A07012; --waitbg:#FBF0D7; --bad:#C2413B; --badbg:#FCE9E7;
  --nav-a:#0E6E4B; --nav-b:#1BA572;
  --shadow:0 1px 2px rgba(18,40,30,.04),0 10px 30px rgba(18,40,30,.06);
  --r:24px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#161F1C; --soft:#1C2824; --line:#26352F;
  --ink:#E7EFEB; --muted:#93A69E;
  --petrol:#3CC48E; --teal:#4FD39C; --green:#4FD39C; --onpetrol:#06231A;
  --lime:#D8E35A; --limebg:#2C301A; --lime-ink:#E4EE9A;
  --ok:#6FD8A6; --okbg:#173A2B; --wait:#E8C46E; --waitbg:#3A2F17; --bad:#F09A9A; --badbg:#3D1E1E;
  --nav-a:#0B3D2B; --nav-b:#12704E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#161F1C; --soft:#1C2824; --line:#26352F;
  --ink:#E7EFEB; --muted:#93A69E;
  --petrol:#3CC48E; --teal:#4FD39C; --green:#4FD39C; --onpetrol:#06231A;
  --lime:#D8E35A; --limebg:#2C301A; --lime-ink:#E4EE9A;
  --ok:#6FD8A6; --okbg:#173A2B; --wait:#E8C46E; --waitbg:#3A2F17; --bad:#F09A9A; --badbg:#3D1E1E;
  --nav-a:#0B3D2B; --nav-b:#12704E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25); color-scheme:dark}

body{background:var(--bg)}
.wrap{max-width:1360px}

/* البطاقات: بلا حدود، زوايا كبيرة، ظل ناعم */
.panel,.tile,.mod,.det,.tbl-wrap,.datebar,.att-list,.pf-body,.pf-tabs,.sec-card,.count,.lvl-stat,.nafs-c,.info-dl div,.link-card,.names,.leader,.goal,.check-list li,.soon{border-color:transparent}
.panel,.tile,.mod,.det,.tbl-wrap,.datebar,.att-list,.pf-body,.pf-tabs,.sec-card,.card{border-radius:var(--r);box-shadow:var(--shadow);border:0}
.card{border:1px solid transparent}
.card:hover,.tile:hover,.mod:hover{border-color:transparent;box-shadow:0 14px 34px rgba(18,40,30,.12)}
.btn{border-radius:999px}
.btn-sm{border-radius:999px}
.in,.search input,.mini .in{border-radius:14px}
.chip{border-radius:999px}
.tabs{border-bottom:0;gap:6px;background:var(--surface);padding:6px;border-radius:999px;width:fit-content;max-width:100%;box-shadow:var(--shadow)}
.tabs button{border:0;border-radius:999px;margin:0;padding:8px 16px}
.tabs button[aria-selected="true"]{background:var(--petrol);color:var(--onpetrol);border:0}
.seg{border-radius:999px;border-color:var(--line)}
.seg button{padding:7px 14px}
.pg-ico{border-radius:50%}
.pg-title h1{font-size:28px;font-weight:800}
.corner{border-bottom-right-radius:22px}
.card-ico,.det-ico,.mod-ico,.tile-ico,.goal-n{border-radius:50%}

/* ===== الشريط العلوي بأزرار كبسولية ===== */
.topbar{background:var(--surface);border-bottom:0;box-shadow:0 1px 0 var(--line)}
.topbar-in{padding-block:12px;gap:14px;position:relative}
.tb-brand,.pills,.search-btn,.fab{display:none}
.tb-brand{align-items:center;gap:10px;text-decoration:none;color:inherit;flex:none}
.tb-logo{width:44px;height:44px;border-radius:14px;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.tb-logo img{width:36px;height:auto}
.tb-logo .logo-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tb-logo .logo-l{display:none}:root:not([data-theme="light"]) .tb-logo .logo-d{display:block}}
:root[data-theme="dark"] .tb-logo .logo-l{display:none} :root[data-theme="dark"] .tb-logo .logo-d{display:block}
.tb-brand-t{display:flex;flex-direction:column;line-height:1.35}
.tb-brand-t b{font-family:var(--f-display);font-size:15px}
.tb-brand-t small{font-size:11.5px;color:var(--muted)}
.pills{align-items:center;gap:6px;flex:1;justify-content:center;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:999px;background:var(--soft);color:var(--ink);text-decoration:none;font-family:var(--f-display);font-size:14px;font-weight:700;border:0;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.pill:hover{background:var(--line)}
.pill.on{background:var(--petrol);color:var(--onpetrol)}
.pill svg{width:15px;height:15px}
.pill-g{position:relative}
.pill-menu{position:absolute;top:calc(100% + 8px);right:0;z-index:40;min-width:240px;background:var(--surface);border-radius:20px;box-shadow:0 18px 44px rgba(18,40,30,.16);padding:8px;display:flex;flex-direction:column;gap:2px}
.pill-menu[hidden]{display:none}
.pill-menu a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;text-decoration:none;font-family:var(--f-display);font-size:14px}
.pill-menu a:hover{background:var(--soft)}
.pill-menu a.on{background:var(--okbg);color:var(--ok)}
.pill-menu a svg{width:17px;height:17px;color:var(--petrol)}
.fab{width:46px;height:46px;border-radius:50%;background:var(--petrol);color:var(--onpetrol);place-items:center;box-shadow:0 8px 18px rgba(18,135,92,.32);flex:none}
.fab svg{width:20px;height:20px}
.fab:hover{filter:brightness(1.08)}
.icon-btn{border-radius:50%;width:42px;height:42px;border:0;background:var(--soft);color:var(--ink)}
.icon-btn:hover{background:var(--line)}
.badge{top:-2px;left:-2px}
.me-chip{border:0;background:transparent;padding:0 6px 0 0;gap:10px}
.me-chip .avatar{width:42px;height:42px;font-size:13px}
.me-name{display:flex;flex-direction:column;line-height:1.35}
.me-name b{font-size:14px}
.me-name small{font-size:11.5px;color:var(--muted);font-family:var(--f-body)}
/* الشريط الجانبي كما كان (بتدرّج البترولي والأخضر) */
.fab{display:inline-grid}
.nav{background:linear-gradient(175deg,#0E4A57,#1B6B57)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav{background:linear-gradient(175deg,#0A2128,#0F3A31)}}
:root[data-theme="dark"] .nav{background:linear-gradient(175deg,#0A2128,#0F3A31)}
@media (max-width:1280px) and (min-width:981px){.me-name{display:none}.me-chip{padding:0}}
@media (max-width:640px){.fab{width:42px;height:42px}}

/* ===== الرئيسية ===== */
.dash2{gap:20px}
.d-head{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:18px;align-items:center}
.d-greet{display:flex;align-items:flex-start;gap:16px;min-width:0}
.d-greet h1{font-size:clamp(30px,3.6vw,48px);font-weight:800;line-height:1.15;letter-spacing:-.01em;display:flex;flex-direction:column}
.d-greet h1 span{font-size:.62em;font-weight:700;color:var(--muted);margin-top:4px}
.d-date{margin:10px 0 0;color:var(--muted);font-size:14.5px}
.rbtn{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--surface);color:var(--ink);box-shadow:var(--shadow);border:0;cursor:pointer;text-decoration:none;flex:none;transition:background .15s,transform .15s}
.rbtn:hover{background:var(--soft);transform:translateY(-1px)}
.rbtn svg{width:19px;height:19px}
.rbtn.sm{width:36px;height:36px;box-shadow:none;background:var(--soft)}
.rbtn.sm svg{width:16px;height:16px}
.rbtn.xs{width:30px;height:30px;box-shadow:none;background:transparent}
.rbtn.xs[disabled]{opacity:.3;cursor:default}
.rbtn.light{background:rgba(255,255,255,.9);color:var(--nav-a)}
.rbtn.back{margin-top:6px}
.d-tools{display:flex;gap:10px;flex-wrap:wrap}
.kpis{display:flex;gap:16px}
.kpi{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"ico k" "v pill";gap:6px 12px;align-items:center;background:var(--surface);border-radius:var(--r);padding:18px 20px;min-width:220px;box-shadow:var(--shadow);text-decoration:none;color:inherit}
.kpi:hover{box-shadow:0 14px 34px rgba(18,40,30,.12)}
.kpi-ico{grid-area:ico;width:34px;height:34px;border-radius:50%;background:var(--limebg);color:var(--lime-ink);display:grid;place-items:center}
.kpi-ico svg{width:18px;height:18px}
.kpi-k{grid-area:k;font-family:var(--f-display);font-weight:700;font-size:15px}
.kpi-v{grid-area:v;font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.dpill{grid-area:pill;justify-self:start;display:inline-flex;align-items:center;gap:4px;background:var(--okbg);color:var(--ok);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.dpill svg{width:13px;height:13px}
.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;align-items:start}
.dcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;min-width:0;position:relative}
.dc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.dc-head h2,.dcard>h2{font-size:19px;font-weight:800;margin:0}
.dcard>h2{margin-bottom:12px}
.d-chart{grid-column:span 7}
.d-hero{grid-column:span 5;grid-row:span 2;padding:14px}
.d-goal{grid-column:span 3}
.d-rem{grid-column:span 4}
.d-table{grid-column:span 7}
.d-people{grid-column:span 5;display:grid;grid-template-columns:1fr;gap:20px}
.d-sched{grid-column:span 5;grid-column-end:-1}
.sel-pill{position:relative;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;padding:0 12px 0 10px;height:36px;background:var(--surface)}
.sel-pill select{appearance:none;border:0;background:transparent;font-family:var(--f-display);font-size:13.5px;padding-left:22px;cursor:pointer;color:var(--ink)}
.sel-pill svg{position:absolute;left:10px;width:15px;height:15px;pointer-events:none;color:var(--muted)}
.chart-legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:4px}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.lg.lime{background:var(--lime)}
.area-chart{position:relative}
.area-chart svg{width:100%;height:auto;display:block;cursor:crosshair}
.area-chart .gl{stroke:var(--line);stroke-width:1;stroke-dasharray:3 5}
.area-chart .ax,.area-chart .xl{fill:var(--muted);font-size:12px;font-family:var(--f-body)}
.area-chart .xl.now{fill:var(--petrol);font-weight:700}
.area-chart .ag-a{stop-color:var(--teal);stop-opacity:.28}
.area-chart .ag-b{stop-color:var(--teal);stop-opacity:0}
.area-chart .ln1{fill:none;stroke:var(--petrol);stroke-width:3;stroke-linecap:round}
.area-chart .ln2{fill:none;stroke:var(--lime);stroke-width:2.5;stroke-linecap:round}
.area-chart .band{fill:var(--okbg)}
.area-chart .hdot{fill:var(--surface);stroke:var(--petrol);stroke-width:3}
.chart-empty{position:absolute;inset:40% 0 auto;text-align:center;margin:0}
.tip{position:absolute;z-index:3;background:var(--surface);border-radius:16px;box-shadow:0 14px 34px rgba(18,40,30,.16);padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:13px;min-width:150px;pointer-events:none}
.tip>b{font-family:var(--f-display);margin-bottom:2px}
.tip span{display:flex;align-items:center;gap:6px}
.tip span b{margin-inline-start:auto;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.tip .lg{width:10px;height:10px}
/* بطاقة المدرسة */
.hero-media{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:12px}
.hero-main{position:relative;min-height:250px;border-radius:20px;overflow:hidden;background:linear-gradient(140deg,var(--nav-a),var(--nav-b));display:flex;align-items:flex-end;padding:16px}
.hero-main::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.18),transparent 45%),radial-gradient(circle,rgba(255,255,255,.12) 0 1.4px,transparent 1.9px) 0 0/16px 16px}
.hero-logo{position:absolute;top:22px;right:22px;width:118px;height:auto;opacity:.95}
.hero-num{position:absolute;left:18px;top:6px;font-family:var(--f-display);font-weight:800;font-size:120px;line-height:1;color:rgba(255,255,255,.14);letter-spacing:-4px}
.hero-main .rbtn{position:absolute;top:14px;left:14px}
.hero-pill{position:relative;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);color:#fff;border-radius:999px;padding:9px 14px 9px 16px;font-family:var(--f-display);font-size:14px}
.hero-pill svg{width:18px;height:18px;background:var(--lime);color:var(--nav-a);border-radius:50%;padding:3px;box-sizing:content-box}
.hero-side{display:grid;grid-template-rows:1fr 1fr;gap:12px}
.hero-thumb{border-radius:18px;background:var(--limebg);color:var(--lime-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-family:var(--f-display);font-size:13px;font-weight:700}
.hero-thumb svg{width:30px;height:30px}
.hero-thumb.alt{background:var(--soft);color:var(--ink)}
.hero-thumb.alt b{width:48px;height:48px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:16px;box-shadow:var(--shadow)}
.hero-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;padding:18px 8px 10px}
.hero-info h3{font-size:20px;font-weight:800}
.hero-info>span{font-size:13px;color:var(--muted)}
.hero-stats{display:flex;gap:8px;margin-top:14px}
.hero-stats div{flex:1;background:var(--soft);border-radius:16px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.hero-stats b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.hero-stats span{font-size:11.5px;color:var(--muted)}
.hero-deals h3{font-size:16px}
.stripe-bar{height:40px;border-radius:12px;background:repeating-linear-gradient(-45deg,var(--soft) 0 6px,var(--line) 6px 9px);overflow:hidden}
.stripe-bar i{display:block;height:100%;border-radius:12px;background:linear-gradient(90deg,var(--teal),var(--petrol))}
.deal-nums{display:flex;justify-content:space-between;margin-top:8px}
.deal-nums div{display:flex;flex-direction:column}
.deal-nums div:last-child{text-align:left}
.deal-nums b{font-family:var(--f-display);font-size:18px}
.deal-nums span{font-size:12px;color:var(--muted)}
.hero-feats{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;border-top:1px solid var(--line);margin:4px 8px 0;padding:14px 0 6px;font-size:13.5px;color:var(--ink)}
.hero-feats span{display:inline-flex;align-items:center;gap:6px}
.hero-feats svg{width:17px;height:17px;color:var(--muted)}
/* مستوى التميز */
.goal-donut{display:flex;justify-content:center;padding:4px 0 10px}
.donut{width:170px;height:170px}
.dn-a{fill:none;stroke:var(--petrol);stroke-width:22;stroke-linecap:round}
.dn-b{fill:none;stroke:var(--lime);stroke-width:22;stroke-linecap:round}
.dn-in{fill:var(--soft)}
.dn-v{text-anchor:middle;font-family:var(--f-display);font-weight:800;font-size:22px;fill:var(--ink)}
.dn-k{text-anchor:middle;font-family:var(--f-body);font-size:10.5px;fill:var(--muted)}
.goal-mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal-mini>div{display:flex;align-items:center;gap:8px}
.goal-mini b{display:block;font-family:var(--f-display);font-size:14px}
.goal-mini span{font-size:11.5px;color:var(--muted)}
.gm-ico{flex:none;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;color:var(--petrol)}
.gm-ico.lime{color:var(--lime-ink)}
.gm-ico svg{width:18px;height:18px}
/* التذكيرات */
.rem-list{display:flex;flex-direction:column;gap:6px}
.rem{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:12px 14px;border-radius:18px;text-decoration:none;color:inherit}
.rem:hover{background:var(--soft)}
.rem.hl{background:var(--soft)}
.rem b{display:block;font-family:var(--f-display);font-size:14.5px}
.rem span{font-size:12.5px;color:var(--muted)}
.rem-go{width:16px;height:16px;color:var(--muted)}
.mring .mr-bg{fill:none;stroke:var(--line);stroke-width:4}
.mring .mr-fg{fill:none;stroke:var(--petrol);stroke-width:4;stroke-linecap:round}
.mring.done .mr-fg{stroke:var(--ok)}
/* جدول اليوم */
.mini-search{position:relative;margin-inline-start:auto}
.mini-search input{border:0;background:var(--soft);border-radius:999px;padding:7px 32px 7px 12px;font-size:13px;width:170px}
.mini-search svg{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--muted)}
.tbl-wrap.flat{box-shadow:none;border-radius:0}
.dtbl th{background:transparent;color:var(--muted);font-weight:600;font-family:var(--f-body);border-bottom:1px solid var(--line)}
.dtbl td{border-top:0;border-bottom:1px solid var(--soft);padding:10px 12px}
.dtbl tbody tr:last-child td{border-bottom:0}
.spill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.spill.ok{background:var(--okbg);color:var(--ok)}
.spill.wait{background:var(--waitbg);color:var(--wait)}
.spill.bad{background:var(--badbg);color:var(--bad)}
.spill.info{background:var(--limebg);color:var(--lime-ink)}
.spill.none{background:var(--soft);color:var(--muted)}
.more-link{display:inline-block;margin-top:10px;font-size:13.5px;color:var(--petrol);font-family:var(--f-display)}
/* بطاقات المناوبة */
.person{display:flex;flex-direction:column;gap:14px}
.person-top{display:flex;align-items:center;gap:12px}
.avatar.md{width:50px;height:50px;font-size:15px}
.avatar.ghost{background:var(--soft);color:var(--petrol)}
.avatar.ghost svg{width:22px;height:22px}
.person-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.45}
.person-t b{font-family:var(--f-display);font-size:16.5px}
.person-t span{font-size:12.5px;color:var(--muted)}
.person-mid{display:flex;align-items:center;justify-content:space-between;gap:10px}
.person-v{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.person-foot{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);border-top:1px solid var(--soft);padding-top:10px}
/* شريط الأسبوع */
.week-strip{display:flex;align-items:center;gap:4px;justify-content:space-between}
.wday{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;border-radius:16px;padding:8px 0;cursor:pointer;color:var(--ink);font-family:var(--f-display)}
.wday b{font-size:15px}
.wday span{font-size:11px;color:var(--muted)}
.wday:hover{background:var(--soft)}
.wday.today b{color:var(--petrol)}
.wday.on{background:var(--petrol);color:var(--onpetrol)}
.wday.on span,.wday.on b{color:var(--onpetrol)}
.sched-tabs{display:flex;justify-content:space-around;margin:12px 0 8px;border-bottom:1px solid var(--soft)}
.sched-tabs button{border:0;background:transparent;padding:8px 10px;font-family:var(--f-display);font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.sched-tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--lime)}
.sched-list{display:flex;flex-direction:column;gap:8px}
.sched{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:14px;background:var(--soft);border-inline-start:3px solid var(--petrol);text-decoration:none;color:inherit}
.sched.duty,.sched.dutyend{border-inline-start-color:var(--lime)}
.sched b{font-family:var(--f-display);font-size:14px}
.sched span{font-size:12.5px;color:var(--muted)}
@media (max-width:1600px){
  .d-head{grid-template-columns:minmax(0,1fr) auto}
  .kpis{grid-column:1/-1}
  .kpi{flex:1}
}
.d-greet h1{font-size:clamp(30px,3.2vw,46px)}
@media (max-width:1100px){
  .d-chart,.d-hero,.d-table,.d-people,.d-sched{grid-column:span 12;grid-row:auto}
  .d-goal,.d-rem{grid-column:span 6}
  .d-people{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .d-head{grid-template-columns:1fr}
  .d-tools{order:3}
