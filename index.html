    const pubN = rows.filter(x => x.ev && x.ev.status === 'published'), avg = pubN.length ? Math.round(pubN.reduce((a, x) => a + x.ev.total, 0) / pubN.length * 10) / 10 : null;
    app.innerHTML = pageWrap(`${pageHead('التقييم الوظيفي', 'star', 'متابعة تقييم أداء جميع المنسوبات وفق نماذج تقييم شاغلي الوظائف التعليمية.', '<button type="button" class="btn btn-ghost" id="ev-csv"><i data-lucide="file-spreadsheet"></i>تصدير Excel</button>')}
      <div class="cat-kpis"><div><b>${ar(rows.length)}</b><span>منسوبة لها نموذج</span></div><div><b>${ar(pubN.length)}</b><span>تقييم معتمد</span></div><div><b>${ar(rows.filter(x => x.ev && x.ev.status === 'draft').length)}</b><span>مسودة</span></div><div><b>${avg != null ? ar(avg) : '—'}</b><span>متوسط الدرجات</span></div></div>
      <div class="tabs" role="tablist">${[['all', 'الكل'], ['none', 'لم يبدأ'], ['draft', 'مسودة'], ['pub', 'معتمد'], ['noacc', 'بلا حساب']].map(([k, l]) => `<button type="button" role="tab" data-f="${k}" aria-selected="${f === k}">${l}</button>`).join('')}</div>
      <div class="ppl">${shown.map(x => `<a class="ppl-row" href="#pf-${esc(x.s.id)}"><span class="avatar">${esc(initials(x.s.name))}</span><div class="ppl-t"><b>${esc(x.s.name)}</b><small>${esc((FORM_LBL[x.form] || '').split('—').pop().trim())}</small></div>
        <div class="ppl-chips">${x.ev ? `<span class="spill ${x.ev.status === 'published' ? 'ok' : 'wait'}">${x.ev.status === 'published' ? 'معتمد' : 'مسودة'}</span>` : `<span class="spill none">${x.m ? 'لم يبدأ' : 'بلا حساب'}</span>`}</div>
        <div class="ppl-bar"><b class="ev-score">${x.ev ? ar(x.ev.total) : '—'}</b><small>شواهد ${ar(x.done)}/${ar(x.items.length)}</small></div><i data-lucide="chevron-left" class="ppl-go"></i></a>`).join('') || '<p class="muted">لا توجد نتائج.</p>'}</div>`);
    icons();
    app.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { M.evF = b.dataset.f; evalsPage(); });
    document.getElementById('ev-csv').onclick = () => exportCsv('التقييم الوظيفي', [['الاسم', 'العمل', 'النموذج', 'الحالة', 'الدرجة', 'التقدير', 'عناصر بشواهد', 'فترة التقييم'],
      ...rows.map(x => [x.s.name, plain(jobOf(x.s)), FORM_LBL[x.form] || '', x.ev ? (x.ev.status === 'published' ? 'معتمد' : 'مسودة') : 'لم يبدأ', x.ev ? x.ev.total : '', x.ev ? gradeOf(x.ev.total) : '', x.done + '/' + x.items.length, x.ev ? x.ev.term || '' : ''])]);
  }

  /* ---------- 🧭 مكتب التوجيه ---------- */
  const PK = {pre: 'وقائي', dev: 'إنمائي', rem: 'علاجي'}, PS = {plan: ['مخطط', 'none'], done: ['منفذ', 'ok'], late: ['مؤجل', 'wait']};
  const CK = {beh: 'سلوكية', acad: 'تحصيلية', psy: 'نفسية', soc: 'اجتماعية', health: 'صحية', abs: 'غياب وتأخر'}, CS = {open: ['مفتوحة', 'wait'], follow: ['تحت المتابعة', 'info'], closed: ['مغلقة', 'ok']};
  async function gcPage(){
    if (needFb()) { app.innerHTML = pageWrap(pageHead('مكتب التوجيه', 'compass', '') + needFb()); return; }
    if (!isCounselorAcct()) { app.innerHTML = pageWrap(`<div class="panel lock-panel"><i data-lucide="lock-keyhole"></i><div><h2>مكتب التوجيه</h2><p>خاص بالموجهة الطلابية وإدارة المدرسة.</p></div></div>`); icons(); return; }
    app.innerHTML = loading();
    let progs = [], cases = [];
    try { [progs, cases] = await Promise.all([fb.fs.collection('cprog').get(), fb.fs.collection('cases').get()].map(p => p.then(x => x.docs.map(d => ({id: d.id, ...d.data()}))))); } catch(e){ app.innerHTML = pageWrap(`<div class="msg err">${esc(authMsg(e))}</div>`); return; }
    progs.sort((a, b) => String(a.date || '').localeCompare(String(b.date || ''))); cases.sort((a, b) => (a.status === 'closed') - (b.status === 'closed') || (a.opened < b.opened ? 1 : -1));
    const tab = M.gcTab || 'prog', done = progs.filter(p => p.status === 'done').length;
    app.innerHTML = pageWrap(`${pageHead('مكتب التوجيه الطلابي', 'compass', 'خطة البرامج وتنفيذها، والحالات الفردية ومتابعتها. الحالات سرية: لا يراها إلا الموجهة والإدارة.')}
      <div class="cat-kpis"><div><b>${ar(progs.length)}</b><span>برنامج في الخطة</span></div><div><b>${progs.length ? ar(Math.round(done / progs.length * 100)) + '٪' : '—'}</b><span>نسبة التنفيذ</span></div><div><b>${ar(cases.filter(c => c.status !== 'closed').length)}</b><span>حالة مفتوحة</span></div><div><b>${ar(cases.filter(c => c.status === 'closed').length)}</b><span>حالة مغلقة</span></div></div>
      <div class="tabs" role="tablist"><button type="button" role="tab" data-gt="prog" aria-selected="${tab === 'prog'}"><i data-lucide="calendar-range"></i>الخطة والبرامج</button><button type="button" role="tab" data-gt="case" aria-selected="${tab === 'case'}"><i data-lucide="lock-keyhole"></i>الحالات</button></div>
      <div id="gc-body"></div>`);
    icons();
    app.querySelectorAll('[data-gt]').forEach(b => b.onclick = () => { M.gcTab = b.dataset.gt; gcPage(); });
    const body = document.getElementById('gc-body');
    if (tab === 'prog') {
      body.innerHTML = `<section class="panel"><h2><i data-lucide="plus"></i>برنامج جديد</h2><div class="gc-form">
          <input class="in" id="p-title" placeholder="عنوان البرنامج"><select class="in" id="p-kind">${Object.entries(PK).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
          <input class="in" id="p-date" type="date" aria-label="الموعد"><input class="in" id="p-target" placeholder="الفئة المستهدفة"></div>
          <button type="button" class="btn btn-primary btn-sm" id="p-add" style="margin-top:8px"><i data-lucide="plus"></i>إضافة إلى الخطة</button></section>
        <div class="ppl">${progs.map(p => `<div class="gc-row" data-p="${esc(p.id)}"><span class="cat-i sm"><i data-lucide="${p.kind === 'rem' ? 'life-buoy' : p.kind === 'pre' ? 'shield-check' : 'sprout'}"></i></span>
          <div class="ppl-t"><b>${esc(p.title)}</b><small>${PK[p.kind] || ''}${p.date ? ' · ' + esc(p.date) : ''}${p.target ? ' · ' + esc(p.target) : ''}${p.count ? ' · ' + ar(p.count) + ' مستفيدة' : ''}</small>${p.impact ? `<small>الأثر: ${esc(p.impact)}</small>` : ''}</div>
          <select class="in in-sm" data-ps aria-label="الحالة">${Object.entries(PS).map(([k, v]) => `<option value="${k}" ${p.status === k ? 'selected' : ''}>${v[0]}</option>`).join('')}</select>
          <input class="in in-sm" data-pc type="number" min="0" placeholder="المستفيدات" value="${esc(p.count || '')}" aria-label="عدد المستفيدات">
          <input class="in in-sm" data-pi placeholder="قياس الأثر" value="${esc(p.impact || '')}" aria-label="قياس الأثر">
          <button type="button" class="icon-btn sm danger" data-pdel aria-label="حذف"><i data-lucide="trash-2"></i></button></div>`).join('') || '<p class="muted">لم تُضف برامج بعد.</p>'}</div>`;
      icons();
      document.getElementById('p-add').onclick = async () => { const t = document.getElementById('p-title').value.trim(); if (!t) return toast('اكتبي عنوان البرنامج.', 'err');
        try { await fb.fs.collection('cprog').add({title: t, kind: document.getElementById('p-kind').value, date: document.getElementById('p-date').value, target: document.getElementById('p-target').value.trim(), status: 'plan', at: new Date().toISOString(), by: acct.email}); gcPage(); } catch(e){ toast(authMsg(e), 'err'); } };
      body.querySelectorAll('[data-p]').forEach(r => {
        const ref = fb.fs.doc('cprog/' + r.dataset.p), up = o => ref.update(o).then(() => toast('حُفظ.', 'ok')).catch(e => toast(authMsg(e), 'err'));
        r.querySelector('[data-ps]').onchange = e => up({status: e.target.value});
        r.querySelector('[data-pc]').onchange = e => up({count: +e.target.value || 0});
        r.querySelector('[data-pi]').onchange = e => up({impact: e.target.value.trim()});
        armDelete(r.querySelector('[data-pdel]'), async () => { await ref.delete(); gcPage(); });
      });
    } else {
      body.innerHTML = `<section class="panel"><h2><i data-lucide="folder-plus"></i>فتح حالة</h2><div class="gc-form">
          <input class="in" id="c-name" placeholder="اسم الطالبة"><input class="in" id="c-grade" placeholder="الصف والفصل">
          <select class="in" id="c-kind">${Object.entries(CK).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select><input class="in" id="c-desc" placeholder="وصف مختصر"></div>
          <button type="button" class="btn btn-primary btn-sm" id="c-add" style="margin-top:8px"><i data-lucide="plus"></i>فتح الحالة</button></section>
        <div class="ppl">${cases.map(c => `<button type="button" class="gc-row case" data-c="${esc(c.id)}"><span class="cat-i sm"><i data-lucide="user-round"></i></span>
          <div class="ppl-t"><b>${esc(c.name)}</b><small>${esc(c.grade || '')} · ${CK[c.kind] || ''} · فُتحت ${dateTxt(c.opened)} · ${ar((c.sessions || []).length)} جلسة</small></div>
          <span class="spill ${(CS[c.status] || CS.open)[1]}">${(CS[c.status] || CS.open)[0]}</span><i data-lucide="chevron-left" class="ppl-go"></i></button>`).join('') || '<p class="muted">لا توجد حالات.</p>'}</div>`;
      icons();
      document.getElementById('c-add').onclick = async () => { const n = document.getElementById('c-name').value.trim(); if (!n) return toast('اكتبي اسم الطالبة.', 'err');
        try { await fb.fs.collection('cases').add({name: n, grade: document.getElementById('c-grade').value.trim(), kind: document.getElementById('c-kind').value, desc: document.getElementById('c-desc').value.trim(), status: 'open', opened: new Date().toISOString(), sessions: [], by: acct.email}); gcPage(); } catch(e){ toast(authMsg(e), 'err'); } };
      body.querySelectorAll('[data-c]').forEach(b => b.onclick = () => caseDrawer(cases.find(c => c.id === b.dataset.c)));
    }
  }
  function caseDrawer(c){
    if (!c) return;
    const layer = document.getElementById('layer');
    layer.innerHTML = `<div class="drawer-bg" id="dbg"><div class="drawer" role="dialog" aria-modal="true" aria-labelledby="cs-t">
      <div class="drawer-head"><h2 id="cs-t"><i data-lucide="lock-keyhole"></i> ${esc(c.name)}</h2><button type="button" class="icon-btn" id="dr-x" aria-label="إغلاق"><i data-lucide="x"></i></button></div>
      <div class="drawer-body">
        <dl class="prof-dl"><div><dt>الصف</dt><dd>${esc(c.grade || '—')}</dd></div><div><dt>نوع الحالة</dt><dd>${CK[c.kind] || ''}</dd></div><div><dt>تاريخ الفتح</dt><dd>${dateTxt(c.opened)}</dd></div><div class="wide"><dt>الوصف</dt><dd>${esc(c.desc || '—')}</dd></div></dl>
        <div class="field"><label for="cs-st">حالة المتابعة</label><select class="in" id="cs-st">${Object.entries(CS).map(([k, v]) => `<option value="${k}" ${c.status === k ? 'selected' : ''}>${v[0]}</option>`).join('')}</select></div>
        <div class="field"><label for="cs-parent">التواصل مع ولية الأمر</label><input class="in" id="cs-parent" value="${esc(c.parent || '')}" placeholder="مثال: اتصال هاتفي بتاريخ…"></div>
        <div class="field"><label for="cs-ref">التحويل لجهة مختصة (إن وُجد)</label><input class="in" id="cs-ref" value="${esc(c.referral || '')}"></div>
        <h3 class="sub-h"><i data-lucide="notebook-pen"></i>الجلسات والإجراءات</h3>
        <div class="task-list sm">${(c.sessions || []).map(s => `<div class="task"><span class="task-c"><i data-lucide="dot"></i></span><div><b>${esc(s.action)}</b><small>${esc(s.date || '')}</small>${s.note ? `<p>${esc(s.note)}</p>` : ''}</div></div>`).join('') || '<p class="muted">لا توجد جلسات.</p>'}</div>
        <div class="row2"><input class="in" id="ss-date" type="date" value="${today()}" aria-label="التاريخ"><input class="in" id="ss-act" placeholder="الإجراء (جلسة فردية، تواصل، خطة…)"></div>
        <textarea class="in" id="ss-note" placeholder="ملاحظة" style="margin-top:8px;min-height:70px"></textarea>
        <button type="button" class="btn btn-ghost btn-sm" id="ss-add" style="margin-top:8px"><i data-lucide="plus"></i>إضافة جلسة</button>
      </div>
      <div class="drawer-foot"><button type="button" class="btn btn-primary" id="cs-save"><i data-lucide="check"></i>حفظ</button><button type="button" class="btn btn-ghost danger" id="cs-del">حذف الحالة</button><button type="button" class="btn btn-ghost" id="dr-cancel">إغلاق</button></div>
    </div></div>`;
    icons();
    const close = () => { layer.innerHTML = ''; gcPage(); };
    const ref = fb.fs.doc('cases/' + c.id);
    layer.querySelector('#dr-x').onclick = close; layer.querySelector('#dr-cancel').onclick = close;
    layer.querySelector('#dbg').addEventListener('click', e => { if (e.target.id === 'dbg') close(); });
    layer.querySelector('#cs-save').onclick = async () => { try { await ref.update({status: layer.querySelector('#cs-st').value, parent: layer.querySelector('#cs-parent').value.trim(), referral: layer.querySelector('#cs-ref').value.trim()}); toast('حُفظت الحالة.', 'ok'); close(); } catch(e){ toast(authMsg(e), 'err'); } };
    layer.querySelector('#ss-add').onclick = async () => { const a = layer.querySelector('#ss-act').value.trim(); if (!a) return toast('اكتبي الإجراء.', 'err');
      const ses = (c.sessions || []).concat({date: layer.querySelector('#ss-date').value, action: a, note: layer.querySelector('#ss-note').value.trim()});
      try { await ref.update({sessions: ses, status: c.status === 'open' ? 'follow' : c.status}); c.sessions = ses; c.status = c.status === 'open' ? 'follow' : c.status; caseDrawer(c); } catch(e){ toast(authMsg(e), 'err'); } };
    armDelete(layer.querySelector('#cs-del'), async () => { await ref.delete(); close(); });
  }
  function lockPage(){ app.innerHTML = pageWrap(`<div class="panel lock-panel"><i data-lucide="lock-keyhole"></i><div><h2>هذه الصفحة غير متاحة لحسابك</h2><p>صفحات المتابعة اليومية تديرها إدارة المدرسة. صفحاتك: <a href="#home">الرئيسية</a>، <a href="#mine">ملفي</a>، <a href="#myatt">حضوري</a>.</p></div></div>`); icons(); }

  /* ---------- التوجيه ---------- */
  function route(){
    let h = (location.hash || '').replace('#', '');
    const st = cur().settings;
    if (h.startsWith('g-')) { ed = 'f'; h = h.slice(2); }
    else if (h && h !== 'admin') ed = 'm';
    else { const sv = store.get('edition'); ed = sv === 'f' || sv === 'm' ? sv : (st.defaultEdition || 'm'); }
    const old = /^e(\d{1,2})$/.exec(h); if (old) h = 'i' + old[1];
    if (!h) h = 'home';
    const school = SCHOOL_ROUTES.includes(h);
    const pg = h === 'profile' || h === 'ach' || h === 'mine' || h === 'cadre' || ['evals', 'myeval', 'myatt', 'mytasks', 'mynotes', 'gc'].includes(h) || /^cat-[a-z]+$/.test(h) || /^pf-[\w-]+$/.test(h);
    const item = !school && !pg && h !== 'admin' && h !== 'ev' && /^[a-z][a-z0-9]{1,24}$/.test(h);
    activeRoute = (school || item || pg || h === 'admin' || h === 'ev') ? h : 'home';
    chrome();
    if (!school) { clearRouteSubs(); curRoute = ''; }
    if (h === 'admin') admin();
    else if (h === 'ev') evHome();
    else if (h === 'profile') profilePage();
    else if (h === 'ach') achPage();
    else if (h === 'mine') minePage();
    else if (h === 'cadre') cadrePage();
    else if (h === 'evals') evalsPage();
    else if (h === 'myeval') myEvalPage();
    else if (h === 'myatt') myAttPage();
    else if (h === 'mytasks') myTasksPage();
    else if (h === 'mynotes') myNotesPage();
    else if (h === 'gc') gcPage();
    else if (h.startsWith('cat-')) catPage(h.slice(4));
    else if (h.startsWith('pf-')) personPage(h.slice(3));
    else if (school && staffOnly()) { clearRouteSubs(); curRoute = ''; h === 'home' ? myHome() : lockPage(); }
    else if (school && roleNow() === 'ops' && h === 'home') { clearRouteSubs(); curRoute = ''; deputyHome(); }
    else if (school && roleNow() === 'ops' && !navAllowed(h)) { clearRouteSubs(); curRoute = ''; lockPage(); }
    else if (school) renderSchool(h);
    else if (item) element(h);
    else renderSchool('home');
    renderBar();
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('#edition button').forEach(b => b.addEventListener('click', () => {
    ed = b.dataset.ed; store.set('edition', ed);
    const h = (location.hash || '').replace('#', '').replace(/^g-/, '') || 'home';
    if (h === 'admin') { chrome(); route(); return; }
    const t = hashFor(h);
    if ('#' + t === location.hash) route(); else location.hash = t;
  }));
  window.addEventListener('hashchange', route);
  route();

  /* ---------- الصلاحيات ---------- */
  (async function caps(){
    if (!window.claude || typeof claude.use !== 'function') {
      if (useFb) { fbStart(); return; }
      if (isLocal || webHost) { canWrite = true; deviceMode = webHost; initDb(mockDb()); } else initDb(null);
      return;
    }
    let u = null;
    try { u = await claude.use('user'); } catch(e) {}
    try { art = await claude.use('artifact'); } catch(e) { art = null; }
    try { dl = await claude.use('downloads'); } catch(e) { dl = null; }
    let d = null;
    try { d = await claude.use('db'); } catch(e) { d = null; }
    if (d) { let w = null; try { w = u ? await u.can('data.write') : null; } catch(e) {} canWrite = w !== false; }
    if (art) { let ok = true; try { if (u) ok = (await u.isOwner()) || (await u.canEdit()); } catch(e) {} canEdit = ok; }
    initDb(d);
    chrome(); renderBar();
    if ((location.hash || '') === '#admin' || staleDraft) route();
  })();
})();
</script>
</body>
</html>
