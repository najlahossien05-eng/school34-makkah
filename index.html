  .kpis{flex-direction:column}
  .kpi{min-width:0}
  .d-goal,.d-rem{grid-column:span 12}
  .d-people{grid-template-columns:1fr}
  .hero-media{grid-template-columns:1fr}
  .hero-side{grid-template-columns:1fr 1fr;grid-template-rows:96px}
  .hero-body{grid-template-columns:1fr}
  .mini-search input{width:120px}
  .dcard{padding:18px}
}

/* ===================== التصميم ٣: بنر رئيسي + خدمات مصغّرة + تجربة جوال احترافية ===================== */

/* ----- البنر الرئيسي ----- */
.hb{position:relative;overflow:hidden;border-radius:26px;color:#fff;padding:24px 26px 22px;
  background:linear-gradient(135deg,#0B5A43 0%,#12875C 55%,#1BA572 100%);box-shadow:0 18px 40px rgba(14,90,64,.22);
  display:flex;flex-direction:column;gap:14px}
.hb::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 12% 0%,rgba(255,255,255,.20),transparent 42%),radial-gradient(circle,rgba(255,255,255,.10) 0 1.3px,transparent 1.8px) 0 0/18px 18px}
.hb::after{content:"";position:absolute;left:-60px;bottom:-80px;width:240px;height:240px;border-radius:50%;background:rgba(228,238,106,.14);pointer-events:none}
.hb>*{position:relative}
.hb-num{position:absolute;left:18px;top:-6px;font-family:var(--f-display);font-weight:800;font-size:150px;line-height:1;color:rgba(255,255,255,.08);pointer-events:none}
.hb-top{display:flex;align-items:center;gap:14px}
.hb-logo{width:86px;height:auto;flex:none;padding-inline-end:14px;border-inline-end:1px solid rgba(255,255,255,.28)}
.hb-id{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
.hb-id small{font-size:12.5px;opacity:.85}
.hb-id h1{font-size:clamp(22px,2.4vw,30px);font-weight:800;color:#fff;margin:0}
.hb-id span{font-size:13px;opacity:.85}
.hb-ref{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer}
.hb-ref:hover{background:rgba(255,255,255,.26)}
.hb-ref svg{width:17px;height:17px}
.hb-greet{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px}
.hb-greet b{font-family:var(--f-display);font-size:19px}
.hb-greet span{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:rgba(255,255,255,.14);border-radius:999px;padding:3px 12px}
.hb-greet svg{width:14px;height:14px}
.hb-lead{margin:0;font-size:14px;line-height:1.75;opacity:.92;max-width:760px}
.hb-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.hb-stats a{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"i v" "i k";align-items:center;column-gap:10px;
  background:rgba(255,255,255,.13);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:10px 12px;color:#fff;text-decoration:none;min-width:0;transition:background .15s}
.hb-stats a:hover{background:rgba(255,255,255,.22)}
.hb-stats svg{grid-area:i;width:30px;height:30px;padding:7px;box-sizing:border-box;border-radius:50%;background:var(--lime);color:#0B5A43}
.hb-stats b{grid-area:v;font-family:var(--f-display);font-size:19px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.hb-stats span{grid-area:k;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-acts{display:flex;flex-wrap:wrap;gap:8px}
.hb-btn{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:8px 16px;font-family:var(--f-display);font-size:14px;font-weight:700;
  color:#fff;text-decoration:none;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22)}
.hb-btn:hover{background:rgba(255,255,255,.24)}
.hb-btn.pri{background:var(--lime);color:#0B4A37;border-color:transparent}
.hb-btn.pri:hover{filter:brightness(1.05)}
.hb-btn svg{width:16px;height:16px}

/* ----- خدمات المنصة: بطاقات صغيرة ----- */
.svc{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:16px 18px}
.svc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.svc-head h2{font-size:17px;font-weight:800;margin:0}
.svc-head span{font-size:12px;color:var(--muted);background:var(--soft);border-radius:999px;padding:2px 10px}
.svc-grid{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:8px}
.svc-t{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border-radius:16px;text-decoration:none;color:var(--ink);text-align:center;transition:background .15s,transform .15s}
.svc-t:hover{background:var(--soft);transform:translateY(-2px)}
.svc-i{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.svc-i svg{width:20px;height:20px}
.svc-l{font-family:var(--f-display);font-size:12.5px;font-weight:700;line-height:1.3}
.svc-t.c1 .svc-i{background:var(--okbg);color:var(--ok)}
.svc-t.c2 .svc-i{background:var(--limebg);color:var(--lime-ink)}
.svc-t.c3 .svc-i{background:#E6F1F6;color:#1D6A86}
.svc-t.c4 .svc-i{background:var(--waitbg);color:var(--wait)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .svc-t.c3 .svc-i{background:#16303A;color:#8CCBD6}}
:root[data-theme="dark"] .svc-t.c3 .svc-i{background:#16303A;color:#8CCBD6}

/* ----- شبكة اللوحة بعد إزالة بطاقة المدرسة (معلوماتها في البنر) ----- */
.dash2{gap:16px}
.dgrid{gap:16px}
.dcard{padding:18px;border-radius:22px}
.dc-head h2,.dcard>h2{font-size:17px}
.d-chart{grid-column:span 8}
.d-goal{grid-column:span 4}
.d-rem{grid-column:span 4}
.d-table{grid-column:span 8}
.d-people{grid-column:span 5;gap:16px}
.d-sched{grid-column:span 7;grid-column-end:auto}
.donut{width:140px;height:140px}
.person{gap:10px}
.avatar.md{width:42px;height:42px;font-size:13px}
.person-v{font-size:20px}
.rem{padding:9px 12px}

/* ----- شريط التنقل السفلي (يظهر على الجوال والجهاز اللوحي فقط) ----- */
.bnav{display:none}
@media (max-width:980px){
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;z-index:40;left:0;right:0;bottom:0;
    background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);
    box-shadow:0 -1px 0 var(--line),0 -8px 24px rgba(18,40,30,.06);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .bnav a,.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:transparent;color:var(--muted);text-decoration:none;font-family:var(--f-display);font-size:11.5px;font-weight:700;cursor:pointer;border-radius:14px}
  .bnav svg{width:21px;height:21px}
  .bnav .on{color:var(--petrol)}
  .bnav .on svg{background:var(--okbg);border-radius:999px;padding:3px 14px;box-sizing:content-box;width:20px;height:20px;margin-block:-3px}
  .main-col{padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
  .fab{display:none}
}

/* ----- جهاز لوحي ----- */
@media (max-width:1100px){
  .svc-grid{grid-template-columns:repeat(6,minmax(0,1fr))}
  .d-chart,.d-table,.d-sched,.d-people{grid-column:span 12}
  .d-goal,.d-rem{grid-column:span 6}
  .d-people{grid-template-columns:1fr 1fr}
}

  .tb-brand{display:flex;flex:1;min-width:0;gap:8px}

.tip[hidden]{display:none}

/* ===================== ألوان هوية وزارة التعليم (تُحمَّل أخيرًا وتعلو على ما قبلها) ===================== */
/* بترولي داكن #0B3D4A · بترولي #0E5A66 · تركوازي #138D90 · فيروزي #1FB5AC · أخضر #2FA37A · أزرق #1F7FA8 */
:root{
  --bg:#EEF4F5; --surface:#FFFFFF; --soft:#EEF7F6; --line:#DCE8EA;
  --ink:#10262D; --muted:#5F7479;
  --petrol:#0E5A66; --teal:#138D90; --green:#2FA37A; --onpetrol:#FFFFFF;
  --lime:#1FB5AC; --limebg:#E2F5F3; --lime-ink:#0E6E6C;
  --ok:#1E8A63; --okbg:#E2F3EC; --info:#1F7FA8; --infobg:#E4F0F7;
  --nav-a:#0B3D4A; --nav-b:#0E5A66;
  --gold:#138D90; --goldbg:#E2F5F3;
  --shadow:0 1px 2px rgba(11,61,74,.05),0 10px 30px rgba(11,61,74,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1619; --surface:#112126; --soft:#16292F; --line:#22393F;
  --ink:#E6F1F2; --muted:#93AAAE;
  --petrol:#3FC2B9; --teal:#4FCFC6; --green:#5CC79A; --onpetrol:#062226;
  --lime:#3FC2B9; --limebg:#143235; --lime-ink:#8EE0D8;
  --nav-a:#07252D; --nav-b:#0B3D4A; --gold:#4FCFC6; --goldbg:#143235}}
:root[data-theme="dark"]{
  --bg:#0A1619; --surface:#112126; --soft:#16292F; --line:#22393F;
  --ink:#E6F1F2; --muted:#93AAAE;
  --petrol:#3FC2B9; --teal:#4FCFC6; --green:#5CC79A; --onpetrol:#062226;
  --lime:#3FC2B9; --limebg:#143235; --lime-ink:#8EE0D8;
  --nav-a:#07252D; --nav-b:#0B3D4A; --gold:#4FCFC6; --goldbg:#143235}

/* القائمة الجانبية */
.nav{background:linear-gradient(175deg,#0B3D4A 0%,#0E5A66 60%,#138D90 100%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nav{background:linear-gradient(175deg,#07252D,#0B3D4A)}}
:root[data-theme="dark"] .nav{background:linear-gradient(175deg,#07252D,#0B3D4A)}
.fab{box-shadow:0 8px 18px rgba(14,90,102,.3)}

/* البنر الرئيسي */
.hb{background:linear-gradient(135deg,#0B3D4A 0%,#0E5A66 45%,#138D90 80%,#1FB5AC 100%);box-shadow:0 18px 40px rgba(11,61,74,.24)}
.hb::after{background:rgba(31,181,172,.18)}
.hb-stats svg{background:#fff;color:#0E5A66}
.hb-btn.pri{background:#fff;color:#0B3D4A}
.hb-btn.pri:hover{background:#EEF7F6;filter:none}
.svc-t.c3 .svc-i{background:var(--infobg);color:var(--info)}

/* الشريط المتحرك: تركوازي بدل الذهبي */
.ticker{border-bottom-color:#1FB5AC}
.tk-lead{background:linear-gradient(100deg,#138D90,#1FB5AC 45%,#138D90);background-size:220% 100%;color:#fff}
.tk-cur.tk-main{color:#BFEDE8}
.tk-dot,.tk-dots i.on{background:#7FDCD3}
.ach-hero .ring-fg{stroke:#7FDCD3}
.pbar.gold i{background:linear-gradient(90deg,#138D90,#1FB5AC)}
.thanks>svg{color:#7FDCD3}

/* الرسم البياني والدائرة */
.area-chart .ln2{stroke:#1F7FA8}
.lg.lime{background:#1F7FA8}
.dn-b{stroke:#1FB5AC}
.sched-tabs button[aria-selected="true"]{border-bottom-color:var(--teal)}
.svc-t.c4 .svc-i{background:#E3EEF0;color:#0B3D4A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .svc-t.c4 .svc-i{background:#173039;color:#8CCBD6}}
:root[data-theme="dark"] .svc-t.c4 .svc-i{background:#173039;color:#8CCBD6}

/* ===== نماذج التقييم: الوزن النسبي، قياس الأثر، اختيار النموذج، بند التقارير ===== */
.wchip{display:inline-flex;align-items:center;gap:4px;margin-top:8px;background:var(--limebg);color:var(--lime-ink);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700;font-family:var(--f-display)}
.wchip.sm{margin:6px 0 0;font-size:12px;padding:2px 10px;align-self:flex-start}
.panel.impact{border-inline-start:4px solid var(--teal)}
.panel.impact h2 svg{color:var(--teal)}
.form-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:18px 0 12px}
.form-pick button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 14px;cursor:pointer;color:var(--ink);font-family:var(--f-display);box-shadow:var(--shadow)}
.form-pick button b{font-size:14.5px;line-height:1.35}
.form-pick button span{font-size:12px;color:var(--muted)}
.form-pick button[aria-selected="true"]{background:linear-gradient(135deg,#0B3D4A,#138D90);color:#fff;border-color:transparent}
.form-pick button[aria-selected="true"] span{color:#CDEDEA}
.rep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.rep-c{position:relative;display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:18px;background:var(--soft);text-decoration:none;color:var(--ink);transition:transform .15s,box-shadow .15s}
a.rep-c:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.rep-n{position:absolute;top:12px;left:14px;font-family:var(--f-display);font-weight:800;color:var(--muted);font-size:13px}
.rep-i{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--surface);color:var(--teal)}
.rep-i svg{width:20px;height:20px}
.rep-c b{font-family:var(--f-display);font-size:16px}
.rep-c p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.rep-go{margin-top:auto;display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--petrol);font-weight:700}
.rep-go svg{width:14px;height:14px}
@media (max-width:760px){
  .form-pick{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:12px 0 8px}
  .form-pick button{padding:8px 10px;border-radius:14px}
  .form-pick button b{font-size:13px}
  .rep-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .rep-c{padding:12px}
  .rep-c b{font-size:14.5px}
  .rep-c p{font-size:12px}
}
@media (max-width:760px){
  .section .grid{grid-template-columns:1fr;gap:8px}
  .section .card{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"ico h" "ico w" "foot foot";align-items:center;gap:2px 12px;padding:12px 14px 10px;min-height:0}
  .section .card .corner{min-width:30px;height:26px;padding-inline:8px;font-size:12px;border-bottom-right-radius:12px}
  .section .card h3{min-height:0}
  .section .card .card-ico{grid-area:ico;width:42px;height:42px;margin:0}
  .section .card .card-ico svg{width:20px;height:20px}
  .section .card h3{grid-area:h;font-size:15px;margin:0;line-height:1.45}
  .section .card .wchip.sm{grid-area:w;margin:0;justify-self:start}
  .section .card .prog{display:none}
  .section .card .card-foot{border-top:0}
  .section .card .card-foot{grid-area:foot;margin-top:8px;padding-top:8px}
  .sec-head p{font-size:13px}
}

/* ===================== شاشة الدخول وإدارة الحسابات ===================== */
body.gated{overflow:hidden}
#gate{position:fixed;inset:0;box-sizing:border-box;width:100vw;max-width:100%;overflow-x:hidden;z-index:200;overflow:auto;background:linear-gradient(150deg,#0B3D4A 0%,#0E5A66 45%,#138D90 85%,#1FB5AC 100%);
  padding:max(20px,env(safe-area-inset-top,0px)) 16px max(20px,env(safe-area-inset-bottom,0px))}
#gate::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 10%,rgba(255,255,255,.18),transparent 40%),radial-gradient(circle,rgba(255,255,255,.08) 0 1.3px,transparent 1.8px) 0 0/18px 18px}
.gate-in{position:relative;box-sizing:border-box;width:100%;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.gate-card{box-sizing:border-box;width:100%;max-width:420px;background:var(--surface);color:var(--ink);border-radius:26px;box-shadow:0 30px 70px rgba(4,30,36,.35);overflow:hidden}
.gate-brand{display:flex;align-items:center;gap:14px;padding:20px 22px;background:linear-gradient(135deg,#0B3D4A,#138D90);color:#fff}
.gate-brand img{width:70px;padding-inline-end:12px;border-inline-end:1px solid rgba(255,255,255,.3)}
.gate-brand div{display:flex;flex-direction:column;line-height:1.35}
.gate-brand small{font-size:12px;opacity:.85}
.gate-brand b{font-family:var(--f-display);font-size:19px}
.gate-body{padding:22px}
.gate-body h1{font-size:22px;font-weight:800;margin:0 0 4px}
.gate-sub{margin:0 0 14px;color:var(--muted);font-size:13.5px;line-height:1.7}
.gate-form{display:flex;flex-direction:column;gap:12px}
.gate-form .field{display:flex;flex-direction:column;gap:5px;margin:0}
.gate-form .field>span:first-child{font-family:var(--f-display);font-weight:700;font-size:14px}
.gate-form .in{width:100%;padding:11px 14px;font-size:15px}
.pw{position:relative;display:block}
.pw .in{padding-left:44px}
.pw-eye{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.pw-eye svg{width:18px;height:18px}
.gate-first{margin-top:16px;padding:14px;border-radius:16px;background:var(--soft);display:flex;flex-direction:column;gap:6px}
.gate-first b{display:flex;align-items:center;gap:6px;font-family:var(--f-display)}
.gate-first b svg{width:18px;height:18px;color:var(--teal)}
.gate-first p{margin:0 0 4px;font-size:13px;color:var(--muted);line-height:1.7}
.gate-wait{display:flex;align-items:center;justify-content:center;gap:10px;padding:26px 0;color:var(--muted)}
.gate-foot{color:rgba(255,255,255,.8);font-size:12.5px;margin:0;text-align:center}
.msg.ok{background:var(--okbg);color:var(--ok)}
/* تذييل القائمة */
.nav-acct{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--nav-line)}
.nav-acct span{font-size:11.5px;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-acct button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--nav-line);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:8px;font-family:var(--f-display);font-size:13.5px;cursor:pointer}
.nav-acct button:hover{background:rgba(255,255,255,.16)}
.nav-acct svg{width:16px;height:16px}
/* المستخدمات */
.u-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.u-form .field{margin:0}
.u-full{grid-column:1/-1}
.u-list{display:flex;flex-direction:column;gap:8px}
.u-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px 12px;padding:10px 12px;border-radius:16px;background:var(--soft)}
.u-t{display:flex;flex-direction:column;min-width:0}
.u-t b{font-family:var(--f-display)}
.u-t small{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.u-acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.btn.danger{color:var(--bad)}
@media (max-width:760px){.u-form{grid-template-columns:1fr}.gate-body{padding:18px}}

/* ===== الدخول بحساب Google وطلب الحساب ===== */
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#1f1f1f;font-family:var(--f-display);font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(11,61,74,.08);margin:6px 0 4px}
.btn-google:hover{background:#F6F9FA}
.btn-google[disabled]{opacity:.6}
.gate-alt{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.gate-alt summary{cursor:pointer;color:var(--muted);font-size:13.5px;padding:4px 0}
.gate-alt[open] summary{margin-bottom:10px}
.gate-who{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--soft);margin:10px 0}
.gate-who img{width:40px;height:40px;border-radius:50%}
.gate-who div{display:flex;flex-direction:column;min-width:0}
.gate-who small{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.r-list{max-height:260px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:2px}
.r-opt{display:flex;flex-direction:column;align-items:flex-start;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;cursor:pointer;color:var(--ink);font-family:var(--f-body)}
.r-opt b{font-family:var(--f-display);font-size:14.5px}
.r-opt small{color:var(--muted);font-size:12px}
.r-opt.on{border-color:var(--teal);background:var(--limebg);box-shadow:inset 0 0 0 1px var(--teal)}
.gate-state{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.gs-ico{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:var(--limebg);color:var(--teal)}
.gs-ico.bad{background:var(--badbg);color:var(--bad)}
.gs-ico svg{width:28px;height:28px}
#gate .btn-block+.btn-block{margin-top:8px}
.u-ph{width:40px;height:40px;border-radius:50%;object-fit:cover}
.u-row.pend{background:var(--waitbg)}
.in-sm{padding:6px 10px;font-size:13px;width:auto;max-width:100%}

/* ===== ملفي / ملف المنسوبة ===== */
.mf-head{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.mf-id{display:flex;align-items:center;gap:14px;min-width:0}
.mf-ph{width:60px;height:60px;border-radius:50%;object-fit:cover}
.avatar.lg{width:60px;height:60px;font-size:18px}
.mf-id small{color:var(--muted);font-size:12.5px}
.mf-id h1{font-size:22px;font-weight:800;margin:0;line-height:1.35}
.mf-id span{font-size:13px;color:var(--muted)}
.mf-stats{display:flex;align-items:center;gap:10px}
.mf-stats>div:not(.mf-ring){display:flex;flex-direction:column;align-items:center;background:var(--soft);border-radius:14px;padding:8px 14px}
.mf-stats b{font-family:var(--f-display);font-size:18px}
.mf-stats span{font-size:11.5px;color:var(--muted)}
.mf-ring{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--teal) calc(var(--p)*1%),var(--line) 0)}
.mf-ring b{width:48px;height:48px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:14px}
.mf-drive{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--waitbg);flex-wrap:wrap}
.mf-drive.ok{background:var(--okbg)}
.mf-drive>div{flex:1;min-width:200px;display:flex;flex-direction:column}
.mf-drive b{font-family:var(--f-display)}
.mf-drive small{font-size:12.5px;color:var(--muted);line-height:1.6}
.mf-dico{width:40px;height:40px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--wait)}
.mf-drive.ok .mf-dico{color:var(--ok)}
#mf-prog{grid-column:1/-1}
#mf-prog .msg{display:flex;align-items:center;gap:8px}
.mf-links{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.mf-sec h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mf-sec h2 small{font-size:12.5px;color:var(--muted);font-weight:400}
.mf-items{display:flex;flex-direction:column;gap:8px}
.mf-it{border-radius:16px;background:var(--soft);overflow:hidden}
.mf-it.has{background:color-mix(in srgb,var(--okbg) 60%,var(--soft))}
.mf-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:10px 12px}
.mf-n{width:32px;height:32px;border-radius:10px;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--petrol);font-size:14px}
.mf-n.ic svg{width:17px;height:17px}
.mf-t{all:unset;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.mf-t b{font-family:var(--f-display);font-size:14.5px;line-height:1.45}
.mf-t small{font-size:12px;color:var(--muted)}
.mf-t:focus-visible{outline:2px solid var(--teal);border-radius:8px}
.mf-st svg{width:20px;height:20px;color:var(--muted)}
.mf-it.has .mf-st svg{color:var(--ok)}
.mf-acts{display:flex;align-items:center;gap:6px}
.icon-btn.sm{width:34px;height:34px}
.icon-btn.sm svg{width:16px;height:16px}
.icon-btn.danger{color:var(--bad)}
.mf-files{display:none;padding:0 12px 12px;flex-direction:column;gap:6px}
.mf-it.open .mf-files{display:flex}
.mf-f{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:6px 10px}
.mf-f>svg{width:18px;height:18px;color:var(--teal)}
.mf-f a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.mf-f small{font-size:11.5px;color:var(--muted)}
.mf-hint{font-size:12.5px;color:var(--muted);line-height:1.7;padding:4px 2px 0}

/* ===== الكادر ===== */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.cat-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"i t n" "k k k";gap:10px 12px;align-items:center;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px;text-decoration:none;color:var(--ink);transition:transform .15s}
.cat-card:hover{transform:translateY(-2px)}
.cat-i{grid-area:i;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#0B3D4A,#138D90);color:#fff}
.cat-i svg{width:22px;height:22px}
.cat-t{grid-area:t;display:flex;flex-direction:column;min-width:0}
.cat-t b{font-family:var(--f-display);font-size:16.5px}
.cat-t small{font-size:12.5px;color:var(--muted)}
.cat-n{grid-area:n;font-family:var(--f-display);font-weight:800;font-size:24px;color:var(--petrol)}
.cat-kpi{grid-area:k;display:flex;flex-wrap:wrap;gap:6px}
.cat-kpi span{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:999px;padding:3px 10px;font-size:12px}
.cat-kpi svg{width:13px;height:13px;color:var(--teal)}
.cat-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.cat-kpis>div{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column}
.cat-kpis b{font-family:var(--f-display);font-size:22px;color:var(--petrol)}
.cat-kpis span{font-size:12.5px;color:var(--muted)}
.ppl{display:flex;flex-direction:column;gap:8px}
.ppl-row{display:grid;grid-template-columns:auto minmax(0,1.4fr) auto minmax(110px,.6fr) auto;align-items:center;gap:12px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:10px 14px;text-decoration:none;color:var(--ink)}
.ppl-row:hover{background:var(--soft)}
.ppl-t{display:flex;flex-direction:column;min-width:0}
.ppl-t b{font-family:var(--f-display);font-size:15px}
.ppl-t small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ppl-chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.ppl-bar{display:flex;align-items:center;gap:6px}
.ppl-bar .bar{flex:1;height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.ppl-bar .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--petrol))}
.ppl-bar small{font-size:12px;color:var(--muted)}
.ppl-go{width:18px;height:18px;color:var(--muted)}
.banner .btn{margin-inline-start:auto}
@media (max-width:760px){
  .mf-head{grid-template-columns:1fr;padding:14px}
  .mf-stats{justify-content:flex-start}
  .mf-id h1{font-size:19px}
  .mf-row{grid-template-columns:auto minmax(0,1fr) auto;padding:10px}
  .mf-st{display:none}
  .mf-acts .btn span{display:none}
  .mf-acts .btn{padding:8px 10px}
  .ppl-row{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"a t g" "c c c" "b b b";gap:6px 10px;padding:10px 12px}
  .ppl-row>.avatar,.ppl-row>.u-ph{grid-area:a}
  .ppl-t{grid-area:t}.ppl-chips{grid-area:c;justify-content:flex-start}.ppl-bar{grid-area:b}.ppl-go{grid-area:g}
  .cat-grid{grid-template-columns:1fr;gap:8px}
  .cat-card{padding:12px 14px}
  .cat-kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
}
.mf-av{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,#0B3D4A,#138D90);color:#fff;font-family:var(--f-display);font-weight:800;font-size:18px}

/* ===================== صفحة الدخول ببابين + صفحات المنسوبة + التقييم + مكتب التوجيه ===================== */
.doors{display:grid;gap:10px;margin-top:6px}
.door{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"i b" "i s";gap:2px 14px;align-items:center;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 16px;cursor:pointer;color:var(--ink);transition:border-color .15s,box-shadow .15s,transform .15s}
.door:hover{border-color:var(--teal);box-shadow:0 10px 24px rgba(11,61,74,.12);transform:translateY(-1px)}
.door b{grid-area:b;font-family:var(--f-display);font-size:17px}
.door small{grid-area:s;color:var(--muted);font-size:12.5px;line-height:1.6}
.door-i{grid-area:i;width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#0B3D4A,#138D90);color:#fff}
.door-i.alt{background:linear-gradient(135deg,#138D90,#1FB5AC)}
.door-i svg{width:24px;height:24px}
.gate-back{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;margin-bottom:6px}
.gate-back svg{width:16px;height:16px}
.cat-pick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:4px 0 12px}
.cp{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 6px;cursor:pointer;color:var(--ink);text-align:center}
.cp b{font-family:var(--f-display);font-size:14.5px}
.cp small{font-size:11.5px;color:var(--muted)}
.cp.on{border-color:var(--teal);background:var(--limebg);box-shadow:inset 0 0 0 1px var(--teal)}
.cp-i{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--teal)}
.cp.on .cp-i{background:var(--teal);color:#fff}
.cp-i svg{width:20px;height:20px}
.cp:last-child:nth-child(odd){grid-column:1/-1}
/* الحسابات */
.acc-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.acc-s{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"i b" "i s" "r r";gap:2px 10px;align-items:center}
.acc-s .cp-i{grid-area:i}
.acc-s b{grid-area:b;font-family:var(--f-display)}
.acc-s>span:not(.cp-i){grid-area:s;font-size:12px;color:var(--muted)}
.acc-s em{font-style:normal;color:var(--wait);font-weight:700}
.acc-bar{grid-area:r;display:block;height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}
.acc-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--petrol))}
.u-grp{display:flex;align-items:center;gap:6px;font-size:15px;margin:14px 0 8px;color:var(--petrol)}
.u-grp svg{width:17px;height:17px}
/* رئيسية المنسوبة */
.my-hb .my-ph{width:58px;height:58px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
.my-hb .mf-av{background:rgba(255,255,255,.18)}
.my-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.my-svc{grid-template-columns:repeat(4,minmax(0,1fr))!important}
/* التقييم */
.ev-tbl{display:flex;flex-direction:column;gap:6px}
.ev-r{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;background:var(--soft);border-radius:14px;padding:10px 12px}
.ev-r.ed{grid-template-columns:auto minmax(0,1fr) minmax(0,auto)}
.ev-t{display:flex;flex-direction:column;min-width:0}
.ev-t b{font-family:var(--f-display);font-size:14.5px}
.ev-t small{font-size:12px;color:var(--muted)}
.ev-s{font-family:var(--f-display);font-weight:700;font-size:13px;border-radius:999px;padding:3px 12px;background:var(--surface);white-space:nowrap}
.ev-s.s5,.ev-s.s4{background:var(--okbg);color:var(--ok)}
.ev-s.s3{background:var(--limebg);color:var(--lime-ink)}
.ev-s.s2,.ev-s.s1{background:var(--badbg);color:var(--bad)}
.ev-in{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.ev-seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.ev-seg button{border:0;background:transparent;width:34px;height:30px;border-radius:999px;font-family:var(--f-display);font-weight:700;cursor:pointer;color:var(--ink)}
.ev-seg button[aria-checked="true"]{background:var(--petrol);color:#fff}
.ev-in .in-sm{width:220px}
.ev-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.ev-foot>div{display:flex;flex-direction:column;margin-inline-end:auto}
.ev-foot b{font-family:var(--f-display);font-size:24px;color:var(--petrol)}
.ev-foot small{font-size:12px;color:var(--muted)}
.ev-score{font-family:var(--f-display);font-size:18px;color:var(--petrol)}
.eval-p h2 .spill{margin-inline-start:auto}
.hist{display:flex;align-items:flex-end;gap:14px;height:150px;padding-top:10px}
.hist>div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:56px}
.hist .bar{width:34px;height:100px;background:var(--soft);border-radius:10px;display:flex;align-items:flex-end;overflow:hidden}
.hist .bar i{display:block;width:100%;background:linear-gradient(180deg,var(--teal),var(--petrol));border-radius:10px}
.hist small{font-size:11px;color:var(--muted);text-align:center}
/* الحضور */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head h2{margin:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-h{text-align:center;font-size:12px;color:var(--muted);font-family:var(--f-display)}
.cal-d{position:relative;min-height:54px;border-radius:12px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.cal-d b{font-family:var(--f-display);font-size:14px}
.cal-d small{font-size:10px;line-height:1.2}
.cal-d.ok{background:var(--okbg);color:var(--ok)}
.cal-d.wait{background:var(--waitbg);color:var(--wait)}
.cal-d.bad{background:var(--badbg);color:var(--bad)}
.cal-d.info{background:var(--infobg);color:var(--info)}
.cal-d.wk{opacity:.45}
.cal-d.now{box-shadow:inset 0 0 0 2px var(--teal)}
.cal-late,.lg.late-dot{position:absolute;top:5px;left:5px;width:7px;height:7px;border-radius:50%;background:var(--wait)}
.lg.late-dot{position:static;display:inline-block}
.cal-leg{flex-wrap:wrap;margin-top:10px}
.lg.wait{background:var(--wait)}.lg.bad{background:var(--bad)}.lg.info{background:var(--info)}
.cat-kpis .k-ok b{color:var(--ok)}.cat-kpis .k-wait b{color:var(--wait)}.cat-kpis .k-bad b{color:var(--bad)}.cat-kpis .k-info b{color:var(--info)}
/* التكليفات والمهام */
.wk-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.wk-d{background:var(--soft);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:90px}
.wk-d.now{box-shadow:inset 0 0 0 2px var(--teal)}
.wk-d>b{font-family:var(--f-display)}
.wk-d .sched{padding:6px 8px;font-size:12px}
.task-list{display:flex;flex-direction:column;gap:8px}
.task-list.sm{margin-top:12px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;background:var(--soft);border-radius:14px;padding:10px 12px}
.task b{font-family:var(--f-display)}
.task p{margin:2px 0;font-size:13px}
.task small{font-size:12px;color:var(--muted)}
.task.done{opacity:.7}
.task.done b{text-decoration:line-through}
.task-c svg{width:20px;height:20px;color:var(--teal)}
/* الملاحظات */
.note-list{display:flex;flex-direction:column;gap:10px}
.note-list.sm{margin-top:12px;gap:6px}
.note{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px}
.note.new{box-shadow:inset 0 0 0 2px var(--teal),var(--shadow)}
.note-i{width:42px;height:42px;border-radius:13px;display:grid;place-items:center}
.note-i.ok{background:var(--okbg);color:var(--ok)}.note-i.info{background:var(--infobg);color:var(--info)}.note-i.wait{background:var(--waitbg);color:var(--wait)}.note-i.bad{background:var(--badbg);color:var(--bad)}
.note-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.note-h b{font-family:var(--f-display)}
.note-h small{color:var(--muted)}
.note p{margin:6px 0;line-height:1.8}
.note-mini{position:relative;background:var(--soft);border-radius:12px;padding:8px 12px 8px 44px}
.note-mini p{margin:2px 0 0;font-size:13px}
.note-mini .icon-btn{position:absolute;left:6px;top:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* مكتب التوجيه */
.gc-form{display:grid;grid-template-columns:2fr 1fr 1fr 1.5fr;gap:8px}
.gc-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto auto;align-items:center;gap:8px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:10px 12px;border:0;text-align:start;color:var(--ink);width:100%;font:inherit}
.gc-row.case{grid-template-columns:auto minmax(0,1fr) auto auto;cursor:pointer}
.gc-row .in-sm{width:120px}
.cat-i.sm{width:38px;height:38px;border-radius:12px}
.cat-i.sm svg{width:18px;height:18px}
@media (max-width:900px){.my-grid{grid-template-columns:1fr}.gc-form{grid-template-columns:1fr 1fr}}
@media (max-width:760px){
  .my-svc{grid-template-columns:repeat(4,minmax(0,1fr))!important}
  .ev-r.ed{grid-template-columns:auto minmax(0,1fr)}
  .ev-r.ed .ev-in{grid-column:1/-1;align-items:stretch}
  .ev-in .in-sm{width:100%}
  .ev-seg{justify-content:space-between}
  .ev-seg button{flex:1}
  .wk-grid{grid-template-columns:1fr}
  .wk-d{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center}
  .wk-d>b{width:72px}
  .cal-d{min-height:44px}
  .cal-d small{display:none}
  .gc-row{grid-template-columns:auto minmax(0,1fr) auto;row-gap:6px}
  .gc-row .in-sm{width:auto;grid-column:span 1}
  .gc-row [data-pc],.gc-row [data-pi]{grid-column:1/-1}
  .gc-form{grid-template-columns:1fr}
  .row2{grid-template-columns:1fr}
  .cat-pick{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.cat-kpis .k-term b{font-size:15px;line-height:1.5}
@media (max-width:760px){
  .cat-kpis.tight{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .cat-kpis.tight>div{padding:8px 6px;align-items:center;text-align:center}
  .cat-kpis.tight b{font-size:18px}
  .cat-kpis.tight span{font-size:10.5px;line-height:1.35}
  .acc-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .acc-s{padding:10px;grid-template-columns:auto 1fr;gap:2px 8px}
  .acc-s .cp-i{width:32px;height:32px}
  .acc-s b{font-size:13.5px}
  .acc-s>span:not(.cp-i){font-size:11px}
}
.gate-link{all:unset;cursor:pointer;color:var(--petrol);font-size:13.5px}
.gate-link:hover{text-decoration:underline}
.gate-link.strong{font-weight:700;font-family:var(--f-display)}
.gate-form .gate-link{align-self:flex-start;margin-top:-4px}
.gate-or{display:flex;align-items:center;gap:10px;margin:14px 0 6px;color:var(--muted);font-size:13px}
.gate-or::before,.gate-or::after{content:"";flex:1;height:1px;background:var(--line)}
.gate-new{text-align:center;margin:14px 0 0;font-size:14px;color:var(--muted)}
/* المسميات الوظيفية في إنشاء الحساب */
.title-pick{display:flex;flex-direction:column;gap:6px;margin:4px 0 12px;max-height:360px;overflow:auto}
.tp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 12px;cursor:pointer;color:var(--ink);text-align:start}
.tp b{font-family:var(--f-display);font-size:14.5px}
.tp small{font-size:11.5px;color:var(--muted);background:var(--soft);border-radius:999px;padding:1px 8px}
.tp.on{border-color:var(--teal);background:var(--limebg);box-shadow:inset 0 0 0 1px var(--teal)}
.tp.on .cp-i{background:var(--teal);color:#fff}
.tp .cp-i{width:34px;height:34px;border-radius:10px}
/* لوحة الوكيلة */
.dep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.dep-c{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;background:var(--soft);border-radius:16px;padding:12px;text-decoration:none;color:var(--ink);border-inline-start:4px solid var(--line)}
.dep-c.ok{border-inline-start-color:var(--ok)}.dep-c.wait{border-inline-start-color:var(--wait)}.dep-c.info{border-inline-start-color:var(--info)}
.dep-c b{font-family:var(--f-display);font-size:15px;display:block}
.dep-c small{font-size:12px;color:var(--muted)}
.dep-c:hover{background:var(--surface);box-shadow:var(--shadow)}
/* وحدات الوكيلة في الحسابات */
.mods{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.mod-c{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.mod-c input{accent-color:var(--teal)}
@media (max-width:760px){.dep-grid{grid-template-columns:1fr}}
@media (max-width:760px){.u-row{grid-template-columns:auto minmax(0,1fr)}.u-row>.spill{grid-column:1/-1;justify-self:start}}

/* ===== الخط: سكالا مجالا (من جهاز المستخدم) مع بديل Noto Naskh Arabic ===== */

@font-face{font-family:"Majalla";src:local("Sakkal Majalla"),local("SakkalMajalla");font-weight:400;font-style:normal;size-adjust:128%}
:root{
  --f-display:"Majalla","Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;
  --f-body:"Majalla","Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;
}
body{line-height:1.7}
h1,h2,h3{line-height:1.35}
.tk-item,.tk-cur{line-height:1.3}
body{font-synthesis:weight style}

  function mockDb(){
    const KEY = 'mock-school-db';
    let data = store.get(KEY) || {};
    const subs = new Set();
    const save = () => { store.set(KEY, data); setTimeout(() => subs.forEach(f => f()), 0); };
    const snap = p => ({id: p.split('/').pop(), exists: p in data, data: () => data[p], metadata: {fromCache: false, hasPendingWrites: false}});
    const doc = p => ({id: p.split('/').pop(), path: p,
      get: async () => snap(p),
      set: async v => { data[p] = clone(v); save(); },
      update: async v => { data[p] = Object.assign({}, data[p], clone(v)); save(); },
      delete: async () => { delete data[p]; save(); },
      onSnapshot(next){ const f = () => next(snap(p)); subs.add(f); setTimeout(f, 30); return () => subs.delete(f); }});
    function query(col, filters, ord, lim){
      const run = () => {
        let docs = Object.keys(data).filter(k => k.startsWith(col + '/') && k.split('/').length === col.split('/').length + 1).map(snap);
        filters.forEach(([f, op, v]) => { docs = docs.filter(d => { const x = d.data()[f]; return op === '==' ? x === v : op === '>=' ? x >= v : op === '<=' ? x <= v : op === '>' ? x > v : op === '<' ? x < v : true; }); });
        if (ord) docs.sort((a, b) => (a.data()[ord[0]] > b.data()[ord[0]] ? 1 : -1) * (ord[1] === 'desc' ? -1 : 1));
        if (lim) docs = docs.slice(0, lim);
        return {docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: {fromCache: false}};
      };
      return {where: (f, op, v) => query(col, [...filters, [f, op, v]], ord, lim), orderBy: (f, d) => query(col, filters, [f, d || 'asc'], lim), limit: n => query(col, filters, ord, n),
        get: async () => run(), onSnapshot(next){ const f = () => next(run()); subs.add(f); setTimeout(f, 30); return () => subs.delete(f); }};
    }
    return {doc, collection: c => Object.assign(query(c, [], null, 0), {path: c, doc: id => doc(c + '/' + (id || Math.random().toString(36).slice(2, 12))), add: async v => { const d = doc(c + '/' + Math.random().toString(36).slice(2, 12)); await d.set(v); return d; }})};
  }

  function autosave(path, getData, delay){
    if (!canWrite) { toast('لا تملك صلاحية تعديل السجلات.', 'err'); return; }
    const p = pend[path] || (pend[path] = {t: null, busy: false, again: false});
    clearTimeout(p.t); saveState('pending');
    p.t = setTimeout(run, delay == null ? 700 : delay);
    async function run(){
      p.t = null;
      if (p.busy) { p.again = true; return; }
      p.busy = true; saveState('saving');
      const ok = await put(path, getData());
      p.busy = false;
      if (p.again) { p.again = false; run(); return; }
      saveState(ok ? 'saved' : 'error');
    }
  }

  function goalDonut(A){
    const a = (A.indicators || [0, 0])[0], b = (A.indicators || [0, 1])[1] || 1;
    const R = 62, C = 2 * Math.PI * R, f1 = a / b, gap = 0.02;
    return `<div class="goal-donut"><svg viewBox="0 0 160 160" class="donut" role="img" aria-label="الأداء العام ${A.overall}٪">
        <circle cx="80" cy="80" r="${R}" class="dn-a" stroke-dasharray="${C * Math.max(0, f1 - gap)} ${C}" transform="rotate(-90 80 80)"/>
        <circle cx="80" cy="80" r="${R}" class="dn-b" stroke-dasharray="${C * Math.max(0, 1 - f1 - gap)} ${C}" stroke-dashoffset="${-C * f1}" transform="rotate(-90 80 80)"/>
        <circle cx="80" cy="80" r="44" class="dn-in"/>
        <text x="80" y="80" class="dn-v">${pc(A.overall)}</text><text x="80" y="99" class="dn-k">الأداء العام</text></svg></div>
      <div class="goal-mini">
        <div><span class="gm-ico"><i data-lucide="target"></i></span><div><b>${ar(a)} من ${ar(b)}</b><span>مؤشرًا في التميز</span></div></div>
        <div><span class="gm-ico lime"><i data-lucide="layers"></i></span><div><b>${ar((A.standards || [0])[0])} من ${ar((A.standards || [0, 0])[1])}</b><span>معيارًا في التميز</span></div></div>
      </div>`;
  }
  function subTrend(force){
    if (!db) return;
    const range = M.dashRange || 'week';
    const start = range === 'week' ? weekStart() : addDays(today(), -27), end = range === 'week' ? addDays(weekStart(), 4) : today();
    if (!force && M.trend.key === range + start) return;
    M.trend = {key: range + start, start, end};
    ['att', 'late'].forEach(c => routeSubs.push(db.collection(c).where('date', '>=', start).where('date', '<=', end).onSnapshot(x => { M.trend[c] = x.docs.map(d => d.data()); drawArea(); }, () => {})));
  }
  function smooth(pts){
    if (pts.length < 2) return pts.length ? `M${pts[0][0]},${pts[0][1]}` : '';
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      d += ` C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`;
    }
    return d;
  }
  function drawArea(){
    const el = document.getElementById('area-chart'); if (!el || !(dbState === 'ok' && S.staffReady)) return;
    const tr = M.trend || {}; if (!tr.start) return;
    const days = []; for (let d = tr.start; d <= tr.end; d = addDays(d, 1)) if (dayIdx(d) <= 4) days.push(d);
    const pts = days.map(d => { const a = (tr.att || []).find(x => x.date === d); const rec = a && a.rec ? Object.values(a.rec) : []; const L = (tr.late || []).find(x => x.date === d);
      return {d, has: !!a, p: rec.filter(r => r.s === 'p' || r.s === 'l').length, x: rec.filter(r => r.s === 'a' || r.s === 'l').length, a: rec.filter(r => r.s === 'a').length, l: rec.filter(r => r.s === 'l').length, c: L ? (L.entries || []).length : 0}; });
    const top = Math.max(4, Math.ceil(Math.max(S.staff.length, ...pts.map(p => p.p)) / 4) * 4);
    const W = 640, H = 230, X0 = 40, X1 = W - 14, Y0 = 14, Y1 = 190;
    const xs = i => pts.length < 2 ? (X0 + X1) / 2 : X1 - i * (X1 - X0) / (pts.length - 1);
    const ys = v => Y1 - v / top * (Y1 - Y0);
    const P1 = pts.map((p, i) => [xs(i), ys(p.p)]), P2 = pts.map((p, i) => [xs(i), ys(p.x)]);
    const line1 = smooth(P1), line2 = smooth(P2);
    const area1 = line1 + ` L${P1[P1.length - 1][0]},${Y1} L${P1[0][0]},${Y1} Z`;
    const step = Math.max(1, Math.ceil(pts.length / 10));
    let svg = `<defs><linearGradient id="ag1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="ag-a"/><stop offset="1" class="ag-b"/></linearGradient></defs>`;
    [0, .25, .5, .75, 1].forEach(f => { const v = Math.round(top * f); svg += `<line x1="${X0}" x2="${X1}" y1="${ys(v)}" y2="${ys(v)}" class="gl"/><text x="${X0 - 8}" y="${ys(v) + 4}" class="ax" text-anchor="end">${ar(v)}</text>`; });
    svg += `<rect id="hover-band" x="0" y="${Y0}" width="0" height="${Y1 - Y0}" rx="10" class="band" opacity="0"/>`;
    svg += `<path d="${area1}" fill="url(#ag1)"/><path d="${line1}" class="ln1"/><path d="${line2}" class="ln2"/>`;
    pts.forEach((p, i) => { if (i % step === 0 || i === pts.length - 1) svg += `<text x="${xs(i)}" y="${Y1 + 24}" class="xl${p.d === today() ? ' now' : ''}" text-anchor="middle">${M.dashRange === 'week' ? DAYS[dayIdx(p.d)] : ar(parseD(p.d).getDate()) + '/' + ar(parseD(p.d).getMonth() + 1)}</text>`; });
    svg += `<circle id="hover-dot" r="6" class="hdot" cx="-20" cy="-20"/>`;
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="الحضور والغياب خلال المدة">${svg}</svg><div class="tip" id="area-tip" hidden></div>${pts.some(p => p.has) ? '' : '<p class="muted chart-empty">لم تُسجَّل أيام حضور في هذه المدة بعد.</p>'}`;
    const svgEl = el.querySelector('svg'), tip = el.querySelector('#area-tip'), band = el.querySelector('#hover-band'), dot = el.querySelector('#hover-dot');
    const bw = Math.max(16, Math.min(46, (X1 - X0) / Math.max(1, pts.length - 1) * .7));
    const show = i => {
      const p = pts[i], x = xs(i);
      band.setAttribute('x', x - bw / 2); band.setAttribute('width', bw); band.setAttribute('opacity', 1);
      dot.setAttribute('cx', x); dot.setAttribute('cy', ys(p.p));
      tip.hidden = false;
      tip.innerHTML = `<b>${dayName(p.d)} ${ar(parseD(p.d).getDate())}/${ar(parseD(p.d).getMonth() + 1)}</b>${p.has ? `<span><i class="lg ok"></i>${g('{حاضر|حاضرة}')}<b>${ar(p.p)}</b></span><span><i class="lg lime"></i>${g('{غائب|غائبة}')}<b>${ar(p.a)}</b></span><span><i class="lg wait"></i>${g('{متأخر|متأخرة}')}<b>${ar(p.l)}</b></span><span><i class="lg bad"></i>تأخر حصص<b>${ar(p.c)}</b></span>` : '<span>لم يُسجَّل</span>'}`;
      const r = svgEl.getBoundingClientRect(), px = x / W * r.width, py = ys(p.p) / H * r.height;
      tip.style.left = Math.min(r.width - tip.offsetWidth - 4, Math.max(4, px - tip.offsetWidth / 2 + (px > r.width / 2 ? -tip.offsetWidth / 2 - 18 : tip.offsetWidth / 2 + 18))) + 'px';
      tip.style.top = Math.max(0, py - 30) + 'px';
    };
    const nearest = ev => { const r = svgEl.getBoundingClientRect(); const x = (ev.clientX - r.left) / r.width * W; let bi = 0, bd = 1e9; pts.forEach((_, i) => { const d = Math.abs(xs(i) - x); if (d < bd) { bd = d; bi = i; } }); return bi; };
    svgEl.addEventListener('mousemove', ev => show(nearest(ev)));
    svgEl.addEventListener('mouseleave', () => { tip.hidden = true; band.setAttribute('opacity', 0); dot.setAttribute('cx', -20); });
    const ti = pts.findIndex(p => p.d === today()); if (ti >= 0 && pts[ti].has) show(ti);
  }

    wireDateBar(d => { M.date = d; subLate(); latePage(true); icons(); });

    body.querySelectorAll('[data-del]').forEach(b => armDelete(b, () => { M.late.entries = M.late.entries.filter(e => e.id !== b.dataset.del); autosave(path, data, 50); lateDay(); icons(); }));

  async function lateMonth(){
    const body = document.getElementById('late-body');
    M.month = M.month || monthNow();
    body.innerHTML = `<div class="toolbar"><label class="mini">الشهر<input type="month" class="in" id="mon" value="${M.month}"></label><span class="muted" id="mon-st">جارٍ الحساب…</span></div><div id="mon-out"></div>`;
    document.getElementById('mon').onchange = e => { if (e.target.value) { M.month = e.target.value; lateMonth(); } };
    const [from, to] = monthRange(M.month);
    let docs = [];
    try { docs = (await db.collection('late').where('date', '>=', from).where('date', '<=', to).get()).docs.map(d => d.data()); }
    catch(e){ document.getElementById('mon-st').textContent = 'تعذّر جلب السجلات.'; return; }
    if (curRoute !== 'late' || M.lateTab !== 'month') return;
    const agg = {}; docs.forEach(d => (d.entries || []).forEach(e => { const a = agg[e.staffId] || (agg[e.staffId] = {n: 0, min: 0}); a.n++; a.min += +e.min || 0; }));
    const rows = Object.entries(agg).sort((a, b) => b[1].n - a[1].n);
    document.getElementById('mon-st').textContent = `حالات التأخر: ${ar(rows.reduce((s, r) => s + r[1].n, 0))}`;
    document.getElementById('mon-out').innerHTML = rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>الاسم</th><th>عدد مرات التأخر</th><th>مجموع الدقائق</th></tr></thead><tbody>
      ${rows.map(([id, a], i) => `<tr><td class="n">${ar(i + 1)}</td><td><b>${esc(sname(id))}</b></td><td class="num-c">${ar(a.n)}</td><td class="num-c">${ar(a.min)}</td></tr>`).join('')}</tbody></table></div>
      <button type="button" class="btn btn-ghost btn-sm" id="mon-csv" style="margin-top:12px"><i data-lucide="file-spreadsheet"></i>تصدير التقرير</button>` : '<p class="muted">لا يوجد تأخر مسجل في هذا الشهر.</p>';
    const c = document.getElementById('mon-csv'); if (c) c.onclick = () => exportCsv('تقرير التأخر ' + M.month, [['#', 'الاسم', 'عدد مرات التأخر', 'مجموع الدقائق'], ...rows.map(([id, a], i) => [i + 1, sname(id), a.n, a.min])]);
    icons();
  }

  /* ---------- الإعدادات المشتركة للجداول ---------- */
  function saveCfg(mut){ const c = clone(cfg()); mut(c); S.cfg = c; autosave('config/main', () => S.cfg, 300); }

  /* ---------- الإشراف اليومي ---------- */
  function supPage(fromData){

    app.innerHTML = `<div class="wrap page">${pageHead('الإشراف اليومي', 'calendar-days', 'جدول الإشراف على الفسح والصلاة والانصراف، ومتابعة تنفيذه يوميًا.')}${gate() || (!S.staff.length ? emptyStaffNote() : tabs + '<div id="sup-body"></div>')}</div>`;
    app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { M.supTab = b.dataset.t; supPage(true); icons(); });
    const body = document.getElementById('sup-body'); if (!body) return;
    M.supTab === 'plan' ? supPlan(body) : supFollow(body);
  }
  function subSup(){
    clearRouteSubs(); M.sup = null;
    if (!db) return;
    const path = 'suplog/' + M.date;
    routeSubs.push(db.doc(path).onSnapshot(x => { if (isPending(path)) return; M.sup = x.exists ? clone(x.data()) : null; if (curRoute === 'sup' && M.supTab === 'follow' && !document.querySelector('.drawer-bg') && !document.activeElement.matches('#sup-body input')) { supPage(true); icons(); } }, () => {}));
  }
  function supPlan(body){
    const c = cfg();
    body.innerHTML = `<div class="tbl-wrap"><table class="tbl grid-tbl"><thead><tr><th>الموقع / الوقت</th>${DAYS.map(d => `<th>${d}</th>`).join('')}</tr></thead><tbody>
      ${c.slots.map(sl => `<tr><th class="slot-h">${canWrite ? `<input class="in slot-in" data-slot="${esc(sl.id)}" value="${esc(sl.name)}" aria-label="اسم الموقع">` : esc(sl.name)}</th>
        ${DAYS.map((d, di) => { const ids = ((c.supGrid[di] || {})[sl.id]) || []; return `<td><div class="cell">${chipsOf(ids)}${canWrite ? `<button type="button" class="cell-edit" data-cell="${di}|${esc(sl.id)}" aria-label="تعديل ${esc(sl.name)} يوم ${d}"><i data-lucide="pencil"></i></button>` : ''}</div></td>`; }).join('')}</tr>`).join('')}
    </tbody></table></div>
    ${canWrite ? `<div class="slot-tools"><input class="in" id="new-slot" placeholder="موقع أو وقت جديد (مثل: الممرات)" aria-label="موقع جديد"><button type="button" class="btn btn-ghost btn-sm" id="add-slot"><i data-lucide="plus"></i>إضافة صف</button>
      ${c.slots.length > 1 ? `<select class="in" id="rm-slot" aria-label="اختر صفًا للحذف"><option value="">حذف صف…</option>${c.slots.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select>` : ''}</div>` : ''}`;
    body.querySelectorAll('[data-cell]').forEach(b => b.onclick = () => {
      const [di, sid] = b.dataset.cell.split('|'); const slot = c.slots.find(s => s.id === sid);
      picker(`${slot.name} — ${DAYS[di]}`, ((c.supGrid[di] || {})[sid]) || [], ids => { saveCfg(x => { x.supGrid[di] = x.supGrid[di] || {}; x.supGrid[di][sid] = ids; }); supPage(true); icons(); });
    });
    body.querySelectorAll('.slot-in').forEach(inp => inp.addEventListener('change', () => { const v = inp.value.trim(); if (v) saveCfg(x => { x.slots.find(s => s.id === inp.dataset.slot).name = v; }); }));
    const as = document.getElementById('add-slot');
    if (as) as.onclick = () => { const v = document.getElementById('new-slot').value.trim(); if (!v) return; saveCfg(x => { x.slots.push({id: uid('s'), name: v}); }); supPage(true); icons(); };
    const rm = document.getElementById('rm-slot');
    if (rm) rm.onchange = () => { const id = rm.value; if (!id) return; saveCfg(x => { x.slots = x.slots.filter(s => s.id !== id); Object.values(x.supGrid).forEach(d => { delete d[id]; }); }); supPage(true); icons(); };
  }
  function supFollow(body){
    const di = dayIdx(M.date), c = cfg();
    const marks = (M.sup && M.sup.marks) || {}, notes = (M.sup && M.sup.notes) || {};
    const rows = di > 4 ? [] : c.slots.map(sl => ({sl, ids: ((c.supGrid[di] || {})[sl.id]) || []})).filter(r => r.ids.length);
    body.innerHTML = `${dateBar(M.date)}
      ${di > 4 ? '<div class="msg info">هذا اليوم عطلة نهاية الأسبوع.</div>' : !rows.length ? `<div class="msg info">لا يوجد ${g('{مشرفون|مشرفات}')} في جدول يوم ${DAYS[di]}. حدّدهم من «جدول الإشراف».</div>` :
      rows.map(({sl, ids}) => `<section class="panel"><h2><i data-lucide="map-pin"></i>${esc(sl.name)}</h2>
        ${ids.map(id => { const m = (marks[sl.id] || {})[id]; return `<div class="follow-row"><b>${esc(sname(id))}</b><div class="seg" role="group" aria-label="تنفيذ ${esc(sname(id))}">
          <button type="button" class="ok" data-m="d" data-k="${esc(sl.id)}|${esc(id)}" aria-pressed="${m === 'd'}" ${canWrite ? '' : 'disabled'}>${g('{نفّذ|نفّذت}')}</button>
          <button type="button" class="bad" data-m="x" data-k="${esc(sl.id)}|${esc(id)}" aria-pressed="${m === 'x'}" ${canWrite ? '' : 'disabled'}>لم ${g('{ينفّذ|تنفّذ}')}</button></div></div>`; }).join('')}
        <input class="in" data-note="${esc(sl.id)}" value="${esc(notes[sl.id] || '')}" placeholder="ملاحظة" aria-label="ملاحظة ${esc(sl.name)}" ${canWrite ? '' : 'disabled'} style="margin-top:8px">
      </section>`).join('')}`;
    wireDateBar(d => { M.date = d; subSup(); supPage(true); icons(); });
    const path = 'suplog/' + M.date;
    const E = () => { if (!M.sup) M.sup = {date: M.date, marks: {}, notes: {}}; M.sup.marks = M.sup.marks || {}; M.sup.notes = M.sup.notes || {}; return M.sup; };
    const data = () => Object.assign({}, E(), {date: M.date, updatedAt: Date.now()});
    body.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { const [sid, id] = b.dataset.k.split('|'); const x = E(); x.marks[sid] = x.marks[sid] || {}; x.marks[sid][id] = x.marks[sid][id] === b.dataset.m ? '' : b.dataset.m; autosave(path, data, 200); supFollow(body); icons(); });
    body.querySelectorAll('[data-note]').forEach(inp => inp.addEventListener('input', () => { E().notes[inp.dataset.note] = inp.value; autosave(path, data, 900); }));
  }

  /* ---------- المناوبة (بداية الدوام ونهايته) ---------- */
  const DUTY = {
    duty: {title: 'مناوبة بداية الدوام', icon: 'door-open', sub: 'استقبال الطلاب عند بداية اليوم الدراسي: الجدول الأسبوعي ومتابعة الحضور.',
      grid: 'dutyGrid', timeKey: 'startTime', defTime: '06:45', timeLbl: 'وقت الوصول', timeName: 'بداية المناوبة', rule: 'وفق الدليل التنظيمي: تبدأ المناوبة قبل الاصطفاف الصباحي بـ15 دقيقة.',
      st: [['o', 'في الوقت', 'ok'], ['l', '{متأخر|متأخرة}', 'wait'], ['x', 'لم {يحضر|تحضر}', 'bad']], auto: (t, ref) => t > ref ? 'l' : 'o'},
    dutyend: {title: 'مناوبة نهاية الدوام', icon: 'sunset', sub: 'متابعة انصراف الطلاب بعد نهاية اليوم الدراسي: الجدول الأسبوعي والمتابعة اليومية.',
      grid: 'dutyEndGrid', timeKey: 'endTime', defTime: '12:30', timeLbl: 'وقت المغادرة', timeName: 'نهاية المناوبة', rule: 'وفق الدليل التنظيمي: تمتد المناوبة بعد نهاية الدوام بما لا يزيد عن 30 دقيقة.',
      st: [['o', '{أتم|أتمت} المناوبة', 'ok'], ['e', '{غادر|غادرت} مبكرًا', 'wait'], ['x', 'لم {يحضر|تحضر}', 'bad']], auto: (t, ref) => t < ref ? 'e' : 'o'}
  };
  function dutyPage(fromData, k){
    const D = DUTY[k], tk = 'tab_' + k;
    if (!fromData) { M.date = M.date || today(); M[tk] = M[tk] || 'follow'; subDuty(k); }
    const tabs = `<div class="tabs" role="tablist"><button type="button" role="tab" data-t="follow" aria-selected="${M[tk] === 'follow'}"><i data-lucide="clipboard-check"></i>المتابعة اليومية</button><button type="button" role="tab" data-t="plan" aria-selected="${M[tk] === 'plan'}"><i data-lucide="table-2"></i>جدول المناوبة</button></div>`;
    app.innerHTML = `<div class="wrap page">${pageHead(D.title, D.icon, D.sub)}${gate() || (!S.staff.length ? emptyStaffNote() : tabs + '<div id="duty-body"></div>')}</div>`;
    app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { M[tk] = b.dataset.t; dutyPage(true, k); });
    const body = document.getElementById('duty-body'); if (!body) return;
    M[tk] === 'plan' ? dutyPlan(body, k) : dutyFollow(body, k);
  }
  function subDuty(k){
    clearRouteSubs(); M['d_' + k] = null;
    if (!db) return;
    const path = k + '/' + M.date;
    routeSubs.push(db.doc(path).onSnapshot(x => { if (isPending(path)) return; M['d_' + k] = x.exists ? clone(x.data()) : null; if (curRoute === k && M['tab_' + k] === 'follow' && !document.querySelector('.drawer-bg') && !document.activeElement.matches('#duty-body input')) dutyPage(true, k); }, () => {}));
  }
  function dutyPlan(body, k){
    const c = cfg(), D = DUTY[k], grid = c[D.grid] || {};
    body.innerHTML = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>اليوم</th><th>${g('{المناوبون|المناوبات}')}</th>${canWrite ? '<th></th>' : ''}</tr></thead><tbody>
      ${DAYS.map((d, di) => `<tr><th class="slot-h">${d}</th><td><div class="pchips">${chipsOf(grid[di])}</div></td>${canWrite ? `<td class="acts"><button type="button" class="btn btn-ghost btn-sm" data-day="${di}"><i data-lucide="pencil"></i>تحديد</button></td>` : ''}</tr>`).join('')}
    </tbody></table></div>
    <div class="form-grid" style="margin-top:14px;max-width:420px"><div class="field"><label for="st-time">${D.timeName}</label><input class="in" type="time" id="st-time" value="${esc(c[D.timeKey] || D.defTime)}" ${canWrite ? '' : 'disabled'}><span class="hint">${D.rule} يُستخدم الوقت لتحديد الحالة تلقائيًا.</span></div></div>`;
    body.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { const di = +b.dataset.day; picker(D.title + ' — ' + DAYS[di], grid[di] || [], ids => { saveCfg(x => { x[D.grid] = x[D.grid] || {}; x[D.grid][di] = ids; }); dutyPage(true, k); }); });
    const t = document.getElementById('st-time'); t.onchange = () => saveCfg(x => { x[D.timeKey] = t.value; });
  }
  function dutyFollow(body, k){
    const di = dayIdx(M.date), c = cfg(), D = DUTY[k];
    const ids = di > 4 ? [] : ((c[D.grid] || {})[di] || []);
    const rec = (M['d_' + k] && M['d_' + k].rec) || {};
    body.innerHTML = `${dateBar(M.date)}<p class="muted rule-note"><i data-lucide="info"></i>${D.rule}</p>
      ${di > 4 ? '<div class="msg info">هذا اليوم عطلة نهاية الأسبوع.</div>' : !ids.length ? `<div class="msg info">لم يُحدَّد ${g('{مناوبون|مناوبات}')} ليوم ${DAYS[di]}. حدّدهم من «جدول المناوبة».</div>` :
      `<section class="panel">${ids.map(id => { const r = rec[id] || {}; return `<div class="follow-row duty" data-id="${esc(id)}"><span class="who">${avatar(sname(id))}<b>${esc(sname(id))}</b></span>
        <label class="mini">${D.timeLbl}<input type="time" class="in" data-f="t" value="${esc(r.t || '')}" ${canWrite ? '' : 'disabled'}></label>
        <div class="seg" role="group" aria-label="حالة ${esc(sname(id))}">${D.st.map(([s, t, cl]) => `<button type="button" class="${cl}" data-s="${s}" aria-pressed="${r.s === s}" ${canWrite ? '' : 'disabled'}>${esc(g(t))}</button>`).join('')}</div>
        <input class="in" data-f="n" value="${esc(r.n || '')}" placeholder="ملاحظة" aria-label="ملاحظة" ${canWrite ? '' : 'disabled'}></div>`; }).join('')}</section>`}`;
    wireDateBar(d => { M.date = d; subDuty(k); dutyPage(true, k); });
    const path = k + '/' + M.date;
    const E = () => { if (!M['d_' + k]) M['d_' + k] = {date: M.date, rec: {}}; M['d_' + k].rec = M['d_' + k].rec || {}; return M['d_' + k].rec; };
    const data = () => ({date: M.date, rec: E(), updatedAt: Date.now()});
    body.querySelectorAll('.follow-row.duty').forEach(row => {
      const id = row.dataset.id;
      row.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { const R = E(); const r = R[id] || (R[id] = {}); r.s = r.s === b.dataset.s ? '' : b.dataset.s; autosave(path, data, 200); dutyFollow(body, k); });
      row.querySelectorAll('[data-f]').forEach(inp => inp.addEventListener('input', () => {
        const R = E(); const r = R[id] || (R[id] = {}); r[inp.dataset.f] = inp.value;
        if (inp.dataset.f === 't' && inp.value && !r.s) { r.s = D.auto(inp.value, c[D.timeKey] || D.defTime); row.querySelectorAll('[data-s]').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === r.s)); }
        autosave(path, data, 900);
      }));
    });
  }

    const forms = j => [j, j.replace(/\{([^|]*)\|([^}]*)\}/g, '$1'), j.replace(/\{([^|]*)\|([^}]*)\}/g, '$2')];

  }

  /* ================= الكادر: ملف كل فئة، وملف كل منسوبة في Google Drive الخاص بها ================= */

    activity: 'نموذج ٢ — معلمة مسند لها نشاط طلابي', health: 'نموذج ٣ — معلمة مسند لها توجيه صحي', kg: 'نموذج ٤ — معلمة رياض الأطفال', lab: 'نموذج ٥ — محضرة المختبر'};
  const FORM_SEC = {principal: 's1', deputy: 's-deputy', counselor: 's-counselor', teacher: 's-teacher', activity: 's-activity', health: 's-health', kg: 's-kg', lab: 's-lab'};
  const FORMS_OF = c => ({lead: ['principal'], deputy: ['deputy'], counselor: ['counselor'], teacher: ['teacher', 'activity', 'health', 'kg', 'lab']})[c] || [];
  const plain = s => String(s || '').replace(/\{([^|{}]*)\|([^|{}]*)\}/g, (_, m, f) => f);
  function catOf(job){
    const j = plain(job);
    if (/مدير/.test(j)) return 'lead';
    if (/وكيل/.test(j)) return 'deputy';
    if (/الموجهة الطلابية|الموجه الطلابي|موجهة طلابية/.test(j)) return 'counselor';
    if (/معلم|رياض|محضر|مختبر|الموجهة الصحية|أمينة مصادر/.test(j)) return 'teacher';
    if (/عاملة|عامل|حارس|مستخدم/.test(j)) return 'service';

  }
  function defForm(job){
    const j = plain(job), c = catOf(job);
    if (c === 'lead') return 'principal'; if (c === 'deputy') return 'deputy'; if (c === 'counselor') return 'counselor';
    if (c !== 'teacher') return '';
    if (/رياض/.test(j)) return 'kg'; if (/محضر|مختبر/.test(j)) return 'lab'; if (/الصحية|صحي/.test(j)) return 'health';

  }
  const secOfForm = f => cur().sections.find(s => s.id === FORM_SEC[f]) || null;
  const TOP = cat => [['info', '01 البيانات الشخصية والسيرة الذاتية'], ...(FORMS_OF(cat).length ? [['ev', '02 شواهد الأداء الوظيفي']] : []), ['pd', '03 التطوير المهني والشهادات'],
    ['plans', '04 الخطط والبرامج'], ['reports', '05 التقارير'], ['thanks', '06 الشكر والإنجازات'], ...(cat === 'counselor' ? [['cases', '07 الحالات (سري)']] : [])];
  const TOP_ICON = {info: 'id-card', ev: 'award', pd: 'graduation-cap', plans: 'calendar-range', reports: 'file-text', thanks: 'medal', cases: 'lock-keyhole'};

  /* ---------- Google Drive (REST) ---------- */
  const DAPI = 'https://www.googleapis.com/drive/v3/files', UAPI = 'https://www.googleapis.com/upload/drive/v3/files';
  const emuId = () => 'emu' + Math.random().toString(36).slice(2, 12);
  async function dreq(url, opt, again){
    const t = await driveToken();
    const r = await fetch(url, Object.assign({}, opt, {headers: Object.assign({Authorization: 'Bearer ' + t}, (opt && opt.headers) || {})}));
    if (r.status === 401 && !again) { gTok = null; try { sessionStorage.removeItem('gtok'); } catch(e){} return dreq(url, opt, true); }
    if (!r.ok) { const tx = await r.text().catch(() => ''); const e = new Error('drive ' + r.status + ' ' + tx.slice(0, 160)); e.status = r.status; throw e; }
    return r.status === 204 ? null : r.json();
  }
  async function dFolder(name, parent){
    if (fbEmu) return {id: emuId(), webViewLink: 'https://drive.google.com/drive/folders/emu'};
    return dreq(DAPI + '?fields=id,webViewLink', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({name, mimeType: 'application/vnd.google-apps.folder', ...(parent ? {parents: [parent]} : {})})});
  }
  async function dShare(id, email){
    if (fbEmu || !email) return;
    await dreq(`${DAPI}/${id}/permissions?sendNotificationEmail=false`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({role: 'reader', type: 'user', emailAddress: email})});
  }
  async function dUpload(file, parent){
    if (fbEmu) return {id: emuId(), name: file.name, webViewLink: 'https://drive.google.com/file/d/emu/view', mimeType: file.type, size: file.size};
    const meta = {name: file.name, parents: [parent]}, F = 'fields=id,name,webViewLink,mimeType,size';
    if (file.size <= 4.5 * 1024 * 1024) {
      const b = 's34-' + Date.now().toString(36);
      const body = new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: ${file.type || 'application/octet-stream'}\r\n\r\n`, file, `\r\n--${b}--`]);
      return dreq(`${UAPI}?uploadType=multipart&${F}`, {method: 'POST', headers: {'Content-Type': 'multipart/related; boundary=' + b}, body});
    }
    const t = await driveToken();
    const s = await fetch(`${UAPI}?uploadType=resumable&${F}`, {method: 'POST', headers: {Authorization: 'Bearer ' + t, 'Content-Type': 'application/json; charset=UTF-8', 'X-Upload-Content-Type': file.type || 'application/octet-stream'}, body: JSON.stringify(meta)});
    const loc = s.headers.get('Location'); if (!s.ok || !loc) throw new Error('drive resumable ' + s.status);
    const r = await fetch(loc, {method: 'PUT', headers: {'Content-Type': file.type || 'application/octet-stream'}, body: file});
    if (!r.ok) throw new Error('drive put ' + r.status);
    return r.json();
  }
  async function dTrash(id){ if (fbEmu) return; await dreq(`${DAPI}/${id}?fields=id`, {method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({trashed: true})}); }

          ${linked ? `<a class="btn btn-ghost btn-sm" href="${esc(P.file.rootLink)}" target="_blank" rel="noopener"><i data-lucide="external-link"></i>فتح في Drive</a>` : (P.self ? `<button type="button" class="btn btn-primary" id="mf-create"><i data-lucide="folder-plus"></i>إنشاء ملفي في Google Drive</button>` : '')}
        </div>

      const [col, date] = path.split('/'), prev = MIR[path]; MIR[path] = clone(data || {});

      const put = (id, patch) => { batch.set(fb.fs.doc('pa/' + id), Object.assign({name: sname(id), at: new Date().toISOString()}, patch), {merge: true}); n++; };
      if (col === 'att') {
        const a = (data && data.rec) || {}, b = (prev && prev.rec) || {};
        new Set([...Object.keys(a), ...Object.keys(b)]).forEach(id => { if (JSON.stringify(a[id] || null) !== JSON.stringify(b[id] || null) || !prev) put(id, {days: {[date]: a[id] ? {s: a[id].s || '', t: a[id].t || '', n: a[id].n || ''} : FV.delete()}}); });
      } else if (col === 'late') {
        const by = d => { const m = {}; ((d && d.entries) || []).forEach(e => { (m[e.staffId] = m[e.staffId] || []).push({p: e.period || '', m: +e.min || 0, a: e.action || ''}); }); return m; };
        const a = by(data), b = by(prev);
        new Set([...Object.keys(a), ...Object.keys(b)]).forEach(id => { if (JSON.stringify(a[id] || null) !== JSON.stringify(b[id] || null) || !prev) put(id, {late: {[date]: a[id] ? a[id] : FV.delete()}}); });
      } else if (col === 'assembly') {
        const a = new Set((data && data.absentStaff) || []), b = new Set((prev && prev.absentStaff) || []);

      }
      if (n) await batch.commit();
    } catch(e){ console.warn('mirror', e); }
  }
